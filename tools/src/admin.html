<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Onboarding Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=DM+Mono:wght@400;500&display=swap">
<!--BRAND_CSS-->
<link rel="stylesheet" href="../assets/common.css">
<script src="../assets/common.js"></script>
<style>
[hidden]{display:none!important}
.backlink{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.backlink:hover{color:var(--ink)}
.adm{display:grid;gap:8px;padding-block:20px 80px}
.adm > *{min-width:0}
.mascot-mini{display:inline-flex;width:22px;height:22px}
.mascot-mini img{width:100%;height:100%;object-fit:contain}
.admin h2{font-size:30px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:14px;flex-wrap:wrap}
.tabs a{font-size:16px;color:var(--muted);text-decoration:none;padding:10px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .count{font-family:var(--mono);font-size:11px;background:var(--yellow);color:#0B0B0B;border-radius:999px;padding:1px 7px;margin-left:6px}
.panel{padding-top:18px;display:grid;gap:14px}
.panel > *,.panel > * > *{min-width:0}
.filters{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.filters select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px}
.filters label{display:flex;gap:6px;align-items:center;font-size:15px}
.cellbar{display:grid;gap:5px;min-width:170px}
.cellbar .ln{display:flex;align-items:center;gap:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cellbar span.b{width:90px;height:8px;background:var(--brick-empty);position:relative;overflow:hidden;display:inline-block}
.cellbar span.b i{position:absolute;inset:0 auto 0 0;background:var(--green)}
.cellbar a{color:var(--ink)}
.cellbar .mini-badge svg{width:18px;height:18px;vertical-align:-4px}
.cellbar .onb-chip{justify-self:start}

.report{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.report.resolved{background:var(--panel)}
.report .meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--muted);align-items:center}
.report .msg{white-space:pre-wrap;max-width:80ch}
.report .about a{color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.err{color:#B00020}

/* dashboard: chart roles (validated: blue/orange, light on #fff, dark on #0b0b0b) */
.viz{--s1:#2a78d6;--s2:#eb6834;--grid:#e1e0d9;--axis:#c3c2b7;--surface:var(--bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .viz{--s1:#3987e5;--s2:#d95926;--grid:#2c2c2a;--axis:#383835}}
:root[data-theme="dark"] .viz{--s1:#3987e5;--s2:#d95926;--grid:#2c2c2a;--axis:#383835}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;align-content:start}
.tile .label{color:var(--muted)}
.tile .v{font-size:34px;line-height:1.05;letter-spacing:-.01em}
.tile .d{font-size:14px;color:var(--muted)}
.pathgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:14px}
.pathcard{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px}
.pathcard h3{font-size:22px;display:flex;align-items:center;gap:10px}
.pathcard h3 i{display:inline-block;width:14px;height:3px;border-radius:2px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.kv div{display:grid;gap:2px}
.kv b{font-weight:400;font-size:24px;line-height:1.1}
.kv span{font-size:13px;color:var(--muted)}
.pacebar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--brick-empty);gap:2px}
.pacebar i{display:block;height:100%}
.pacelegend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pacelegend span{display:inline-flex;gap:6px;align-items:center}
.pacelegend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:14px}
.chart{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;position:relative;min-width:0}
.chart h3{font-size:18px}
.chart .sub{font-size:13px;color:var(--muted)}
.legend{display:flex;gap:2px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted);line-height:1.4}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:2px;border-radius:1px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg:focus{outline:none}
.chart svg:focus-visible{outline:2px solid var(--focus);outline-offset:4px;border-radius:4px}
.chart .tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:8px 10px;font-size:13px;display:grid;gap:4px;min-width:130px;z-index:5}
.chart .tip .t{color:var(--muted);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.chart .tip .r{display:flex;align-items:center;gap:8px}
.chart .tip .r i{width:12px;height:2px;border-radius:1px;display:inline-block}
.chart .tip .r b{font-weight:500;font-size:15px;min-width:2ch}
.chart .tablebtn{justify-self:start;font:inherit;font-size:13px;color:var(--link);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.chart table{font-size:13px}
.chart td,.chart th{padding:5px 8px;font-variant-numeric:tabular-nums}
#reports-out,#users-out,#content-out{display:grid;gap:12px}
#reports-out > *,#users-out > *,#content-out > *{min-width:0}
.viz{--s3:#1f9e89;--s4:#9b59d0;--s5:#d1495b;--s6:#6b7280}

/* reports */
.rbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.small{font-size:14px;color:var(--muted)}
.jline{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.key{font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--link)}
.js{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;border:1px solid var(--line)}
.js.indeterminate{background:var(--blue);border-color:var(--blue);color:#0B0B0B}
.js.done{background:var(--green);border-color:var(--green);color:#0B0B0B}
.files{display:flex;gap:8px;flex-wrap:wrap;font-size:14px}

/* content: list and create flows */
.plist td,.plist th{vertical-align:middle}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;border:1px solid var(--line)}
.pill.pub{background:var(--green);border-color:var(--green);color:#0B0B0B}
.pill.dr{background:var(--panel)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.onb-dialog.flat{box-shadow:none;border:1px solid var(--line);max-width:none}
.choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.fork{all:unset;box-sizing:border-box;display:grid;gap:4px;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;color:var(--ink)}
.fork:hover,.fork:focus-visible{border-color:var(--ink);background:var(--panel)}
.fork b{font-weight:400;font-size:19px}
.fork span{color:var(--muted);font-size:15px}
.form{max-width:860px;display:grid;gap:14px}
.leftlist{margin-top:22px;display:grid;gap:6px}
.leftlist ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:15px}
.wsteps{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.wsteps li{display:flex;align-items:center;gap:6px}
.wsteps .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:999px;border:1px solid var(--line);font-family:var(--mono);font-size:11px}
.wsteps li.done .n{background:var(--green);border-color:var(--green);color:#0B0B0B}
.wsteps li[aria-current="step"]{color:var(--ink)}
.wsteps li[aria-current="step"] .n{background:var(--ink);border-color:var(--ink);color:var(--bg)}
details.more summary{cursor:pointer;font-size:15px;color:var(--link)}
label.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
label.check > span{display:grid;gap:2px}
.shape{display:grid;gap:4px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:15px}
.callout{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:10px 12px;margin:12px 0;font-size:15px}
.callout .sp{flex:1 1 auto}
.pill.gen{background:var(--blue);border-color:var(--blue);color:#0B0B0B}
.pill.fail{background:#FFD3D3;border-color:#FFD3D3;color:#0B0B0B}
.form .field input,.form .field textarea,.form .field select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%;min-width:0}
.form .field textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:14px}
.srcs{display:grid;gap:6px}
.srcs > *{min-width:0}
.src{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.src .u{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .ok{grid-column:2;font-size:13px;color:var(--muted)}
.src button{grid-row:1;grid-column:3;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
.lnkin{display:flex;gap:8px;flex-wrap:wrap}
.lnkin input{flex:1 1 220px;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-width:0}
.found{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.found .fh{display:grid;gap:2px}
.found label{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.found .fi{padding-left:24px}
.warnrow{display:grid;gap:2px;background:var(--yellow);color:#0B0B0B;border-radius:var(--r);padding:8px 10px;margin-left:24px;font-size:15px}
.warnrow .small{color:#0B0B0B}
.more{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:1px dashed var(--muted);border-radius:var(--r);padding:12px 14px}
.more>div:first-child{display:grid;gap:2px}
.steps{display:grid;gap:8px}
.st{font-size:16px;padding-left:26px;position:relative}
.st.done::before{content:"✓";position:absolute;left:0;width:18px;height:18px;border-radius:50%;background:var(--green);color:#0B0B0B;font-size:12px;display:grid;place-items:center;top:2px}
.st.now::before{content:"";position:absolute;left:0;top:3px;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* users */
.ptop{display:flex;gap:12px 20px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.invite{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1 1 320px;min-width:0;max-width:100%}
.emailin{flex:1 1 260px;display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.emailin input{flex:1;border:0;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);padding:8px 10px;min-width:0;outline:none}
.emailin span{font-family:var(--mono);font-size:14px;color:var(--muted);background:var(--panel);padding:8px 10px;display:flex;align-items:center;border-left:1px solid var(--line)}
.rp{margin-top:22px}
.ptable{border:1px solid var(--line);border-radius:var(--r)}
.pgh{display:flex;gap:8px;align-items:baseline;padding:12px 14px;background:var(--panel);flex-wrap:wrap;border-radius:var(--r) var(--r) 0 0}
.pgh h3{font-size:20px}.pgh .sp{flex:1}
.pgh .seg button{font-size:13px;padding:4px 10px}
.prow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) minmax(0,1.6fr) minmax(0,1fr) 200px;gap:6px 14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.phead{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-block:6px}
.pp{display:grid;gap:1px;min-width:0}.pp span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.roles{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.act{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.act .btn{font-size:14px;padding:5px 10px}
.lock{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.onb-chip.locked::before{content:"🔒 ";font-size:9px}
.prow.new{background:color-mix(in srgb,var(--green) 18%,var(--bg));grid-template-columns:minmax(0,2fr) minmax(0,5fr)}
.justin{font-family:var(--mono);font-size:10.5px!important;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)!important;margin-top:4px}
.pick{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;position:relative}
.pick .label{width:100%}
.pick label{display:inline-flex;gap:6px;align-items:center;font-size:15px;border:1px solid var(--ink);border-radius:var(--r);padding:5px 10px;background:var(--bg);cursor:pointer}
.pick .small{flex:1 1 220px}
.tip{position:relative}
.tip::after{content:attr(data-tip);position:absolute;z-index:20;left:0;top:calc(100% + 8px);width:max-content;max-width:min(260px,calc(100vw - 48px));background:var(--ink);color:var(--bg);font-family:var(--sans);font-size:13px;line-height:1.35;letter-spacing:0;text-transform:none;text-align:left;padding:8px 10px;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;pointer-events:none;white-space:normal}
.tip:hover::after,.tip:focus-visible::after,.tip.show::after{display:block}
@media (max-width:640px){
  .phead{display:none}
  .prow,.prow.new{grid-template-columns:1fr}
  .prow [data-l]::before{content:attr(data-l) ": ";font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .act{justify-content:flex-start}
  .rp{margin-top:0}
  .pick{position:relative}.pick .tip{position:static}.pick .tip::after{left:0;right:auto;top:72px;width:auto;max-width:100%}
}
.paste{border:1px dashed var(--muted);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.paste.over{border-color:var(--ink);background:var(--panel)}
.paste p{font-size:14px;color:var(--muted)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs:empty{display:none}
.thumbs figure{margin:0;display:grid;gap:4px;width:92px;position:relative}
.thumbs figure.up{opacity:.5}
.thumbs img,.thumbs .doc{height:64px;width:92px;object-fit:cover;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.thumbs .doc{display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.thumbs figcaption{font-family:var(--mono);font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumbs .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-size:13px;line-height:1;padding:0}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="backlink" href="../">&larr; Learning paths</a>
    <div class="top-row" style="margin-top:10px">
      <div class="title-block">
        <span class="eyebrow">DataRobot onboarding</span>
        <h1>Admin</h1>
        <div class="who"><span id="who-name"></span><span class="save-state" id="who-state" data-s="init">Loading</span></div>
      </div>
    </div>
  </div>
</header>
<main class="wrap adm" id="admin">
  <nav class="tabs" aria-label="Admin">
    <a href="#dashboard" data-tab="dashboard">Dashboard</a>
    <a href="#team" data-tab="team">Team progress</a>
    <a href="#reports" data-tab="reports">Problem reports<span class="count" id="rep-count" hidden></span></a>
    <a href="#content" data-tab="content">Content</a>
    <a href="#users" data-tab="users" hidden>Users</a>
  </nav>
  <div class="panel" data-panel="dashboard"><div id="dash-out" class="viz"><div class="empty">Loading…</div></div></div>
  <div class="panel" data-panel="team" hidden><div id="team-out"><div class="empty">Loading…</div></div></div>
  <div class="panel" data-panel="reports" hidden><div id="reports-out"><div class="empty">Loading…</div></div></div>
  <div class="panel" data-panel="content" hidden><div id="content-out"><div class="empty">Loading…</div></div></div>
  <div class="panel" data-panel="users" hidden><div id="users-out"><div class="empty">Loading…</div></div></div>
</main>
<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var BASE = location.pathname.replace(/\/?$/, "/");
  var ROOT = BASE + "../";
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === "class") el.className = v; else if (k === "text") el.textContent = v; else if (k === "html") el.innerHTML = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
    });
    function put(c) { if (c == null || c === false) return; if (Array.isArray(c)) { c.forEach(put); return; } el.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
    for (var i = 2; i < arguments.length; i++) put(arguments[i]);
    return el;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function s(tag, attrs) { var el = document.createElementNS(SVGNS, tag); Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); }); return el; }
  function pct(d, t) { return t ? Math.round(100 * d / t) : 0; }
  function rel(ts) {
    if (!ts) return "—";
    var diff = (ts - Date.now()) / 1000, a = Math.abs(diff), f = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
    if (a < 3600) return f.format(Math.round(diff / 60), "minute");
    if (a < 86400) return f.format(Math.round(diff / 3600), "hour");
    return f.format(Math.round(diff / 86400), "day");
  }
  function chip(p) { return p ? h("span", { class: "onb-chip", "data-s": p.status }, p.label) : null; }
  function badge() { return h("span", { class: "mini-badge", title: "Completed", html: DROnb.badgeSvg() }); }
  function mascotThumb(k) { return k ? h("span", { class: "mascot-mini", title: "Skill growth: stage " + k + " of 10" }, h("img", { src: ROOT + "assets/mascots/year-" + (k < 10 ? "0" : "") + k + ".png", alt: "" })) : null; }
  function api(path, opts) {
    return fetch(ROOT + path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.detail || ("Request failed (" + r.status + ")")); return j; });
    });
  }
  function showTab() {
    var t = (location.hash || "#dashboard").slice(1);
    if (t === "create") t = "content";
    if (!/^(dashboard|team|reports|content|users)$/.test(t) || (t === "users" && !(ME && ME.isManager))) t = "dashboard";
    $$("[data-tab]").forEach(function (a) { if (a.dataset.tab === t) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    $$("[data-panel]").forEach(function (p) { p.hidden = p.dataset.panel !== t; });
    if (t === "dashboard" && dash) renderDashboard();
  }

  /* ---------------------------------------------------------------- dashboard */

        box.appendChild(h("label", { class: "fi" }, cb, h("span", null, it.label + (it.count ? "" : " (nothing readable)"))));
      });
      g.warnings.forEach(function (w) { box.appendChild(h("div", { class: "warnrow" }, h("b", null, w.title), h("span", { class: "small" }, w.text))); });
      return box;
    });
    wSave();
    // Missing something: more links and files, read on top of what was found.
    var extra = [];
    var moreLinks = linkList(extra, function () {});
    var more = uploader({ text: "Drop more files or ", after: "." });
    var moreErr = errBox();
    var readMore = btn("Read them too", false, function () {
      moreLinks.flush();
      if (!extra.length && !more.count()) { showErr(moreErr, "Add a link or a file first."); return; }
      if (more.busy()) { showErr(moreErr, "Wait until the files have uploaded."); return; }
      readMore.disabled = true; readMore.textContent = "Reading…"; moreErr.hidden = true;
      var prog = h("div", { class: "steps" });
      moreBox.appendChild(prog);
      api("api/admin/paths/find", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ addTo: W.findJob, links: extra, uploads: more.ids(), githubToken: GH }) })
        .then(function (j) { return poll(j.job, function (job) { drawSteps(prog, job); }).then(function (job) {
          W.findJob = j.job; W.found = job.result; W.links = W.links.concat(extra); W.uploads = W.uploads.concat(more.list()); wizard("review");
        }); })
        .catch(function (e) { readMore.disabled = false; readMore.textContent = "Read them too"; prog.remove(); showErr(moreErr, e.message); });
    });
    var moreBox = h("details", { class: "more" }, h("summary", null, "Missing something? Add more links or files"),
      h("div", { class: "form", style: "margin-top:10px" }, moreLinks.el, more.el, moreErr, h("div", { class: "row end" }, readMore)));
    var total = h("div", { class: "tile" }, h("span", { class: "label" }, "Total to read"),
      h("b", null, "About " + (found.pages || 0) + " page" + (found.pages === 1 ? "" : "s") + " of material" + (found.images ? ", " + found.images + " image" + (found.images === 1 ? "" : "s") : "") + "."),
      h("span", { class: "small" }, "The LLM summarizes each source first, then builds the path from all the summaries, so nothing is cut off for length."));
    var err = errBox();
    var go = btn("Generate draft", true, function () { go.disabled = true; startGeneration(err, go); });
    wFrame("Review what we found", "Before generating, check what the LLM will read. Untick anything that's out of date or not relevant.",
      [groups, moreBox, total, err], [btn("Back", false, function () { wizard("sources"); }), go]);
  }

  /* step 5: generate (in the background) */
  function startGeneration(err, go) {
    var title = W.title;
    api("api/admin/paths/generate", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ job: W.findJob, unchecked: Object.keys(W.unchecked), settings: settingsOf(), retryOf: W.retryOf,
        wizard: { links: W.links, uploads: W.uploads, step: "review" } }) })
      .then(function (j) {
        DROnb.addGenerating(ME.id, j.id);
        DROnb.watchDrafts(ROOT, ME.id, loadContent);
        wClear();
        justStarted = { id: j.id, title: title };
        return loadContent();
      }, function (e) { go.disabled = false; showErr(err, e.message); });
  }
  var justStarted = null;
  var WANT_CREATE = location.hash === "#create";  // from the welcome banner's "Create a learning path"
  function loadContent() {
    return api("api/admin/paths").then(function (j) {
      contentData = j;
      if (!W) contentHome();
      if (WANT_CREATE) { WANT_CREATE = false; history.replaceState(null, "", "#content"); if (j.canCreate && !W) { var left = wStored(); if (left) { W = left; wizard(); } else startWizard(); } }
    }, function (e) { $("#content-out").textContent = e.message; });
  }

  /* ---------------------------------------------------------------- admin: users */
  var TIP = { admin: "Sees and manages every path, the dashboard and problem reports, and invites people.",
    author: "Creates learning paths and owns what they create. Sees only those paths' progress, problem reports and content." };
  var usersData = null, uFilter = "all", justInvited = null, editing = null;
  function roleChip(r, locked) { return h("span", { class: "onb-chip tip" + (locked ? " locked" : ""), tabindex: "0", "data-tip": TIP[r] }, r === "admin" ? "Admin" : "Author"); }
  function renderUsers() {
    var out = $("#users-out"); out.textContent = "";
    var em = h("input", { placeholder: "first.last", "aria-label": "Email (before @datarobot.com)", autocomplete: "off" });
    var inv = h("button", { type: "button", class: "btn primary" }, "Invite");
    var rp = h("button", { type: "button", class: "btn ghost rp", html: '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3 1v14M3 2h9l-2 3 2 3H3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Report a problem' });
    var ierr = h("p", { class: "err", hidden: true, style: "width:100%" });
    function invite() {
      var v = em.value.trim(); if (!v) { em.focus(); return; }
      inv.disabled = true;
      api("api/admin/users", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: v.replace(/@datarobot\.com$/i, "") }) })
        .then(function (j) { justInvited = j.user.email; loadUsers(); }, function (e) { inv.disabled = false; ierr.textContent = e.message; ierr.hidden = false; });
    }
    inv.addEventListener("click", invite);
    em.addEventListener("keydown", function (e) { if (e.key === "Enter") invite(); });
    em.addEventListener("input", function () { if (/@/.test(em.value)) em.value = em.value.replace(/@.*$/, ""); });
    rp.addEventListener("click", systemReport);
    out.appendChild(h("div", { class: "ptop" }, h("div", { class: "invite" }, h("span", { class: "label", style: "width:100%" }, "Step 1: invite"), h("div", { class: "emailin" }, em, h("span", null, "@datarobot.com")), inv, ierr), rp));
    var U = usersData.users;
    var n = { all: U.length, admin: 0, author: 0, none: 0 };
    U.forEach(function (u) { if (u.roles.indexOf("admin") >= 0) n.admin++; if (u.roles.indexOf("author") >= 0) n.author++; if (!u.roles.length) n.none++; });
    var filt = seg([["all", "All"], ["admin", "Admins " + n.admin], ["author", "Authors " + n.author], ["none", "No role " + n.none]], uFilter, function (v) { uFilter = v; renderUsers(); });
    var table = h("div", { class: "ptable" }, h("div", { class: "pgh" }, h("h3", null, "Users"), h("span", { class: "small" }, String(U.length)), h("span", { class: "sp" }), filt),
      h("div", { class: "prow phead" }, h("span", null, "User"), h("span", null, "Roles"), h("span", null, "Owns"), h("span", null, "Added"), h("span")));
    var list = U.filter(function (u) { return uFilter === "all" || (uFilter === "none" ? !u.roles.length : u.roles.indexOf(uFilter) >= 0); });
    list.sort(function (x, y) { return (y.email === justInvited) - (x.email === justInvited) || (y.system - x.system) || x.name.localeCompare(y.name); });
    list.forEach(function (u) { table.appendChild(u.email === justInvited || u.email === editing ? pickRow(u) : userRow(u)); });
    out.appendChild(table);
    out.appendChild(h("p", { class: "small" }, "Removing someone keeps their paths. An admin can give each path a new owner. System admins (set in the app's runtime parameters) can't lose the Admin role here, so nobody gets locked out."));
  }
  function seenText(u) { return u.lastSeen ? "Last seen " + rel(u.lastSeen) : "Hasn't opened the app yet"; }
  function userRow(u) {
    var roles = u.roles.length ? u.roles.map(function (r) { return roleChip(r, r === "admin" && u.system); }) : [h("span", { class: "small" }, "No role yet")];
    var edit = h("button", { type: "button", class: "btn ghost" }, u.roles.length ? "Edit roles" : "Assign roles");
    edit.addEventListener("click", function () { editing = u.email; renderUsers(); });
    var act;
    if (u.system) act = [edit, h("span", { class: "lock", title: "Set in the app's runtime parameters (MANAGER_EMAILS)" }, "🔒 System admin")];
    else {
      var rm = h("button", { type: "button", class: "btn ghost" }, "Remove");
      rm.addEventListener("click", function () {
        if (!confirm("Remove " + (u.name || u.email) + "? Their paths are kept.")) return;
        api("api/admin/users/" + encodeURIComponent(u.email), { method: "DELETE" }).then(loadUsers, function (e) { alert(e.message); });
      });
      act = [edit, rm];
    }
    var owns = (u.owns || []).length ? u.owns.map(function (p, i) { return [i ? ", " : "", h("a", { href: ROOT + p.id + "/", style: "color:var(--ink)" }, p.title), p.status !== "published" ? [" ", h("span", { class: "onb-chip" }, "Draft")] : null]; }) : [h("span", { class: "small" }, "—")];
    return h("div", { class: "prow" },
      h("span", { class: "pp" }, h("b", null, u.name || u.email), h("span", null, u.email), h("span", null, seenText(u))),
      h("span", { "data-l": "Roles", class: "roles" }, roles),
      h("span", { "data-l": "Owns" }, owns),
      h("span", { "data-l": "Added" }, u.system && !u.addedAt ? "Runtime parameters" : (u.addedAt ? new Date(u.addedAt).toLocaleDateString(undefined, { day: "numeric", month: "short" }) : "—") + (u.addedBy && u.addedBy !== "Runtime parameters" ? " · " + u.addedBy.split(" ")[0] : "")),
      h("span", { class: "act" }, act));
  }
  function pickRow(u) {
    var adm = h("input", { type: "checkbox", checked: u.roles.indexOf("admin") >= 0, disabled: u.system });
    var aut = h("input", { type: "checkbox", checked: u.roles.indexOf("author") >= 0 });
    var save = h("button", { type: "button", class: "btn primary" }, "Save roles"), later = h("button", { type: "button", class: "btn ghost" }, "Later");
    var err = h("p", { class: "err", hidden: true });
    later.addEventListener("click", function () { justInvited = null; editing = null; renderUsers(); });
    save.addEventListener("click", function () {
      var roles = []; if (adm.checked) roles.push("admin"); if (aut.checked) roles.push("author");
      save.disabled = true;
      api("api/admin/users/" + encodeURIComponent(u.email), { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ roles: roles }) })
        .then(function () { justInvited = null; editing = null; loadUsers(); }, function (e) { save.disabled = false; err.textContent = e.message; err.hidden = false; });
    });
    return h("div", { class: "prow new" },
      h("span", { class: "pp" }, h("b", null, u.name || u.email), h("span", null, u.email), u.email === justInvited ? h("span", { class: "justin" }, "Just invited") : null),
      h("div", { class: "pick" }, h("span", { class: "label" }, (u.email === justInvited ? "Step 2: " : "") + "assign roles"),
        h("label", { class: "tip", "data-tip": TIP.admin }, adm, "Admin"), h("label", { class: "tip", "data-tip": TIP.author }, aut, "Author"),
        h("span", { class: "small" }, "Pick one, both, or none for now. With no role they can still use the hub as a learner."),
        h("div", { class: "row" }, later, save), err));
  }
  function systemReport() {
    var ta = h("textarea", { "aria-label": "What's wrong?", placeholder: "What's wrong with the app?" });
    var up = uploader({ text: "Paste screenshots with ⌘V / Ctrl+V, drop files here, or ", after: "." });
    var send = h("button", { type: "button", class: "btn primary" }, "Send to system admins"), cancel = h("button", { type: "button", class: "btn ghost" }, "Cancel");
    var err = h("p", { class: "err", hidden: true });
    var dlg = h("div", { class: "onb-dialog", role: "dialog", "aria-modal": "true", "aria-label": "Report a problem to the system admins" },
      h("span", { class: "label" }, "Admin"), h("h2", null, "Report a problem to the system admins"), h("div", { class: "about" }, "About: Admin → Users"),
      h("p", null, "For problems with the app itself: roles not working, someone can't get in, something broken on the admin pages."),
      h("span", { class: "onb-fl" }, "What's wrong?"), ta, up.el, err, h("div", { class: "row" }, cancel, send));
    var wrap = h("div", { class: "onb-modal" }, dlg);
    document.body.appendChild(wrap);
    dlg.addEventListener("paste", function (e) { var fs = (e.clipboardData && e.clipboardData.files) || []; if (fs.length) { e.preventDefault(); Array.prototype.forEach.call(fs, up.upload); } });
    function close() { wrap.remove(); }
    wrap.addEventListener("click", function (e) { if (e.target === wrap) close(); });
    cancel.addEventListener("click", close);
    send.addEventListener("click", function () {
      var msg = ta.value.trim(); if (!msg) { ta.focus(); return; }
      if (up.busy()) { err.textContent = "Wait until the files have uploaded."; err.hidden = false; return; }
      send.disabled = true;
      api("api/admin/system-report", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ message: msg, uploads: up.ids(), about: "Admin → Users" }) })
        .then(function () { dlg.textContent = ""; var ok = h("button", { type: "button", class: "btn primary" }, "Close"); ok.addEventListener("click", close); add(dlg, [h("h2", null, "Thanks, it's sent"), h("p", null, "The system admins have your report."), h("div", { class: "row" }, ok)]); loadReports(); },
          function (e) { send.disabled = false; err.textContent = e.message; err.hidden = false; });
    });
    ta.focus();
  }
  function loadUsers() { return api("api/admin/users").then(function (j) { usersData = j; renderUsers(); }, function (e) { $("#users-out").textContent = e.message; }); }

  /* ---------------------------------------------------------------- boot */
  var ME = null;
  api("api/me").then(function (me) {
    ME = me;
    $("#who-name").textContent = me.name || me.email || "";
    $("#who-state").hidden = true;
    if (!me.canAdmin) { $("#admin").textContent = ""; $("#admin").appendChild(h("div", { class: "empty" }, "This page is for onboarding admins and path authors. Ask an admin to invite you.")); return; }
    if (me.isManager) $('[data-tab="users"]').hidden = false;
    showTab();
    window.addEventListener("hashchange", showTab);
    loadDashboard(); loadTeam(); loadReports(); loadContent();
    DROnb.watchDrafts(ROOT, me.id, loadContent);
    if (me.isManager) loadUsers();
    setInterval(function () { if (!document.hidden) { loadTeam(); loadReports(); loadDashboard(); } }, 120000);
  }, function (e) { var st = $("#who-state"); st.dataset.s = "local"; st.textContent = "Couldn't load: " + e.message; });
})();
</script>
