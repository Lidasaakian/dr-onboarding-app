<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Learning path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=DM+Mono:wght@400;500&display=swap">
<!--BRAND_CSS-->
<style>
/* Paths created in the app: same field-manual system as the other paths. */
[hidden]{display:none!important}
[data-page] > *{min-width:0}
.backlink{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.backlink:hover{color:var(--ink)}
.meter-extra{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.meter-extra b{font-weight:500;color:var(--ink)}
.rightcol{display:grid;gap:14px;min-width:min(100%,420px)}
.top-row{align-items:flex-start}
.rightcol .onb-mascot{max-width:none}
.blurb{color:var(--muted);font-size:17px;max-width:62ch}
.daylist{display:grid;gap:12px}
.dayhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin-top:8px}
.dayhead h3{font-size:22px}
.item{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;align-items:start;scroll-margin-top:70px}
.item.is-done{background:var(--panel)}
.item.is-done .ititle{color:var(--muted)}
.item .ib{display:grid;gap:8px;min-width:0}
.item .ihead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.item .ititle{font-size:18px;line-height:1.3}
.item .ititle a{color:inherit;text-decoration-color:var(--link)}
.item .ititle a:hover{color:var(--link)}
.item .dt{font-size:15px;max-width:72ch}
.item .dt.edblock-wrap{white-space:pre-line}
.dt p{margin:0 0 6px}
.dt ul,.dt ol{margin:0 0 6px;padding-left:22px;display:grid;gap:2px}
.dt ul.checklist{list-style:none;padding-left:0}
.dt ul.checklist label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.dt ul.checklist input{margin-top:4px}
.dt ul.checklist input:checked + span{color:var(--muted);text-decoration:line-through}
.fmtbar{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px}
.fmtbar button{font:inherit;font-size:13px;line-height:1;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;cursor:pointer}
.fmtbar button:hover{border-color:var(--ink)}
.item .src{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel);border-radius:3px;padding:2px 6px;justify-self:start}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);white-space:nowrap}
.tag.req{border-color:var(--ink);color:var(--ink)}
.item.gate{border:1.5px solid var(--green)}
.item.gate .tag.gate{background:var(--green);border-color:var(--green);color:var(--on-green)}
.item.editing{background:color-mix(in srgb,var(--yellow) 14%,var(--bg))}
.ed{display:inline-block;min-width:2ch}
.ed:empty::before{content:attr(data-ph);color:var(--muted)}
.edblock{display:block;min-height:1.4em}
.addrow{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px dashed var(--muted);border-radius:var(--r);padding:8px 12px;cursor:pointer;justify-self:start}
.addrow:hover{border-color:var(--ink)}
.spark{font:inherit;font-size:15px;line-height:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;padding:3px 7px;cursor:pointer;vertical-align:middle}
.spark:hover,.spark[aria-pressed="true"]{border-color:var(--ink);background:var(--yellow);color:#0B0B0B}
.ask{border:1px solid var(--ink);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.ask textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-height:64px;width:100%;resize:vertical}
.ask .row,.proposal .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ask .sp,.proposal .sp{flex:1}
.ask .small,.small{font-size:14px;color:var(--muted)}
.proposal{background:var(--panel);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.chg{font-size:15px;padding:6px 10px;border-radius:4px;background:var(--bg);border-left:3px solid var(--blue)}
.chg.add{border-left-color:var(--green)}.chg.del{border-left-color:#B00020}
.chg .from{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.steps{display:grid;gap:6px}
.st{font-size:15px;padding-left:24px;position:relative}
.st.done::before{content:"✓";position:absolute;left:0;width:17px;height:17px;border-radius:50%;background:var(--green);color:#0B0B0B;font-size:11px;display:grid;place-items:center;top:2px}
.st.now::before{content:"";position:absolute;left:0;top:3px;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.notice{background:var(--yellow);color:#0B0B0B;border-radius:var(--r);padding:10px 12px;font-size:15px}
.grphead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grphead h2{flex:1 1 auto}
.settings{display:grid;gap:12px}
.settings .field input,.settings .field textarea,.settings select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%}
.archived-note{margin:10px 0 0;padding:8px 12px;border-radius:var(--r);background:var(--panel);font-size:15px;max-width:72ch}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.onb-dialog.wide2{max-width:640px;max-height:90vh;overflow:auto}
.team-detail td{background:var(--panel)}
@media (max-width:520px){
  .item{padding:12px;grid-template-columns:24px minmax(0,1fr);gap:10px}
  .item .ititle{font-size:17px}
}
</style>
<link rel="stylesheet" href="../assets/common.css">
<script src="../assets/common.js"></script>
<script src="../assets/format.js"></script>
</head>
<body>
<div class="onb-editbar" id="editbar" hidden>
  <div class="wrap">
    <b id="eb-title">Draft</b><span id="eb-note">Only owners and admins can see it.</span>
    <span style="flex:1"></span>
    <button class="btn" id="eb-settings" type="button">Settings</button>
    <button class="btn" id="eb-report" type="button" hidden>Generation report</button>
    <button class="btn" id="eb-preview" type="button">Preview as learner</button>
    <button class="btn" id="eb-undo" type="button" disabled>Undo</button>
    <a class="btn" id="eb-xlsx" href="#">Download as .xlsx</a>
    <button class="btn" id="eb-discard" type="button" hidden>Discard changes</button>
    <button class="btn primary" id="eb-publish" type="button">Publish</button>
  </div>
</div>
<div class="onb-editbar" id="previewbar" hidden>
  <div class="wrap"><b>Preview as learner.</b><span>Ticks aren't saved.</span><span style="flex:1"></span><button class="btn primary" id="pv-back" type="button">Back to editing</button></div>
</div>
<header class="top">
  <div class="wrap">
    <a class="backlink" id="hub-link" href="../">&larr; All learning paths</a>
    <div class="top-row" style="margin-top:10px">
      <div class="title-block">
        <span class="eyebrow" id="doc-length"></span>
        <h1 id="doc-title">Learning path</h1>
        <p class="blurb" id="doc-blurb" hidden></p>
        <div class="who"><span id="who-name"></span><span class="save-state" id="save-state" data-s="init">Loading</span></div>
        <div class="onb-pace" id="pace"></div>
        <div id="badge" hidden></div>
      </div>
      <div class="rightcol">
        <div id="mascot"></div>
        <div class="meter" aria-label="Overall progress">
          <div class="meter-figs"><span class="meter-pct" id="pct">0%</span><span class="meter-sub" id="pct-sub">0 of 0 steps</span></div>
          <div class="meter-extra"><span>Required <b id="req-sub">0/0</b></span><span id="gate-wrap">Gates passed <b id="gate-sub">0/0</b></span></div>
          <nav class="daybricks" id="bricks" aria-label="Sections"></nav>
        </div>
      </div>
    </div>
    <div class="top-actions" id="top-actions">
      <button class="btn primary" id="btn-resume" type="button">Continue where I left off</button>
    </div>
  </div>
</header>
<div class="wrap frame">
  <nav class="side" id="side" aria-label="Learning path"></nav>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<!--PATH_JSON-->
<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var BASE = location.pathname.replace(/\/?$/, "/");
  var API = BASE + "api/";
  var ROOT = BASE + "../";
  $("#hub-link").href = ROOT;
  var DATA = {};
  try { DATA = JSON.parse(($("#path-data") || {}).textContent || "{}"); } catch (e) { DATA = {}; }
  var PID = DATA.id || BASE.split("/").filter(Boolean).pop();
  var CACHE_KEY = "dr-onb-path-" + PID;

  function blank() { return { v: 1, done: {}, stars: {}, startedAt: null, updatedAt: null, last: null }; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  var S = blank(), store = null, earlyEdits = false;
  var C = null;            // content shown (live for learners, draft while editing)
  var LIVE = null, INFO = null, ME = null;
  var EDIT = false, PREVIEW = false, canEdit = false, ARCHIVED = false;  // archived: read-only for everyone

  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    });
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  function a(url, label) { return h("a", { href: url, target: "_blank", rel: "noopener" }, label || url); }
  // Step details: DRFormat (assets/format.js) parses the text; this turns the tree into DOM nodes, never HTML.
  function inlineNodes(nodes) {
    var frag = document.createDocumentFragment();
    nodes.forEach(function (n) {
      if (n.t === "text") frag.appendChild(document.createTextNode(n.v));
      else if (n.t === "code") frag.appendChild(h("code", null, n.v));
      else if (n.t === "a") frag.appendChild(h("a", { href: n.href, target: "_blank", rel: "noopener" }, inlineNodes(n.c)));
      else frag.appendChild(h(n.t === "b" ? "strong" : "em", null, inlineNodes(n.c)));
    });
    return frag;
  }
  function rich(s, stepId) {
    var frag = document.createDocumentFragment();
    DRFormat.parse(s).forEach(function (bl) {
      if (bl.type === "p") {
        var p = h("p");
        bl.lines.forEach(function (ln, i) { if (i) p.appendChild(h("br")); p.appendChild(inlineNodes(ln)); });
        frag.appendChild(p);
      } else if (bl.type === "check") {
        frag.appendChild(h("ul", { class: "checklist" }, bl.items.map(function (it) { return h("li", null, checkItem(stepId, it)); })));
      } else {
        frag.appendChild(h(bl.type, null, bl.items.map(function (it) { return h("li", null, inlineNodes(it)); })));
      }
    });
    return frag;
  }
  // A checklist item's tick is kept per learner in S.checks[step id][item index]; it never counts toward progress.
  function checkItem(stepId, it) {
    var saved = stepId && S.checks && S.checks[stepId] && S.checks[stepId][it.index];
    var on = stepId ? !!saved : it.checked;
    var cb = h("input", { type: "checkbox", checked: on || null, disabled: !stepId || EDIT || PREVIEW || !LIVE || ARCHIVED ? true : null });
    cb.addEventListener("change", function () {
      if (cb.checked && window.DROnb && !DROnb.isEnrolled()) { cb.checked = false; DROnb.ensureEnrolled(); return; }
      S.checks = S.checks || {};
      var m = S.checks[stepId] = S.checks[stepId] || {};
      if (cb.checked) m[it.index] = Date.now(); else delete m[it.index];
      if (!Object.keys(m).length) delete S.checks[stepId];
      if (!store) earlyEdits = true;
      save();
    });
    return h("label", null, cb, h("span", null, inlineNodes(it.content)));
  }
  function api(path, opts) {
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.detail || ("Request failed (" + r.status + ")")); return j; });
    });
  }
  function jsonOpts(method, body) { return { method: method, headers: { "content-type": "application/json" }, body: JSON.stringify(body) }; }
  function newId(p) { return p + Math.random().toString(16).slice(2, 10); }

  /* ---------------------------------------------------------------- model helpers */
  var items = [], byId = {}, pages = {}, pageOrder = [], navItems = {}, boxes = {}, current = null;
  // Structure (custom_paths.py): cadence, level names, and sections that show their title instead of a number.
  // Content saved before cadence existed only has pace, level and useDays.
  var DEF_LEVELS = { weeks: ["Week", "Day"], days: ["Day", ""], self: ["Module", ""] };
  function cadence() { return C.cadence || (C.pace === "days" ? "days" : "weeks"); }
  function levels() { return C.levels ? [C.levels.top || "Week", C.levels.sub || ""] : [C.level || "Week", C.useDays === false ? "" : "Day"]; }
  function lvl() { return levels()[0]; }
  function sub() { return levels()[1]; }
  function numbered(g) { return g.numbered !== false; }
  function gLabel(gi) {
    var g = C.groups[gi];
    if (!numbered(g)) return g.title || "Section";
    var n = 0;
    for (var i = 0; i <= gi; i++) if (numbered(C.groups[i])) n++;
    return lvl() + " " + n;
  }
  function dLabel(di) { return sub() + " " + (di + 1); }
  function where(it) { return gLabel(it.gi) + (sub() ? " · " + dLabel(it.di) : ""); }
  function indexItems() {
    items = []; byId = {};
    C.groups.forEach(function (g, gi) { g.days.forEach(function (d, di) { d.steps.forEach(function (st) { var it = { st: st, id: st.id, gi: gi, di: di, g: g, d: d }; items.push(it); byId[st.id] = it; }); }); });
  }

  /* ---------------------------------------------------------------- editing helpers */
  var history_ = [], editDirty = false, saveTimer = null;
  function snapshot() { history_.push(JSON.stringify(C)); if (history_.length > 60) history_.shift(); $("#eb-undo").disabled = false; }
  function changed(rebuildNow) { editDirty = true; scheduleSave(); if (rebuildNow) rebuild(); }
  function E(obj, key, o) {
    o = o || {};
    var v = obj ? obj[key] : "";
    if (!EDIT) return o.plain ? document.createTextNode(v == null ? "" : String(v)) : rich(v);
    var sp = h("span", { contenteditable: "plaintext-only", class: "ed" + (o.block ? " edblock" : ""), spellcheck: "true", "data-ph": o.ph || "(empty)" });
    sp.textContent = v == null ? "" : String(v);
    var first = true;
    sp.addEventListener("input", function () { if (first) { snapshot(); first = false; } obj[key] = sp.textContent; changed(false); });
    sp.addEventListener("blur", function () { first = true; });
    if (!o.block) sp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); sp.blur(); } });
    ["click", "mousedown"].forEach(function (ev) { sp.addEventListener(ev, function (e) { e.stopPropagation(); }); });
    return sp;
  }

  // A step's details in edit mode, with buttons that add the formatting syntax (assets/format.js) to the selection.
  function detailsEditor(st) {
    var sp = E(st, "details", { block: true, ph: "Details: how to do it and how you know it's done" });
    function sel() {  // the selection as offsets in the field's text (the end of the text when nothing is selected)
      var t = sp.textContent, s = window.getSelection(), start = t.length, end = t.length;
      if (s.rangeCount && sp.contains(s.anchorNode)) {
        var r = s.getRangeAt(0), pre = r.cloneRange();
        pre.selectNodeContents(sp); pre.setEnd(r.startContainer, r.startOffset);
        start = pre.toString().length; end = start + r.toString().length;
      }
      return { t: t, start: start, end: end };
    }
    function put(text, caret) {
      snapshot(); st.details = text; sp.textContent = text; changed(false);
      sp.focus();
      var n = sp.firstChild;
      if (n) { var r = document.createRange(); r.setStart(n, Math.min(caret, text.length)); r.collapse(true); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
    }
    function lines(prefix) {  // turn the selected lines (or the cursor's line) into list items
      var x = sel(), a = x.t.lastIndexOf("\n", x.start - 1) + 1, b = x.t.indexOf("\n", x.end);
      if (b < 0) b = x.t.length;
      var block = x.t.slice(a, b).split("\n").map(function (ln, i) { return prefix(ln.replace(/^\s*(?:[-*]\s+\[[ xX]\]\s+|[-*]\s+|\d{1,3}[.)]\s+)/, ""), i); }).join("\n");
      put(x.t.slice(0, a) + block + x.t.slice(b), a + block.length);
    }
    function wrap(l, r, ph) {
      var x = sel(), inner = x.t.slice(x.start, x.end) || ph;
      put(x.t.slice(0, x.start) + l + inner + r + x.t.slice(x.end), x.start + l.length + inner.length + r.length);
    }
    function link() {
      var x = sel(), url = (prompt("Link address (https://…)") || "").trim();
      if (!url) return;
      if (!/^https?:\/\/\S+$/i.test(url)) { alert("Use a web address that starts with https://"); return; }
      var md = "[" + (x.t.slice(x.start, x.end) || "link text") + "](" + url + ")";
      put(x.t.slice(0, x.start) + md + x.t.slice(x.end), x.start + md.length);
    }
    var bar = h("div", { class: "fmtbar", role: "toolbar", "aria-label": "Formatting" });
    [["• List", "Bulleted list", function () { lines(function (l) { return "- " + l; }); }],
     ["1. List", "Numbered list", function () { lines(function (l, i) { return (i + 1) + ". " + l; }); }],
     ["☐ Checklist", "Checklist", function () { lines(function (l) { return "- [ ] " + l; }); }],
     ["B", "Bold", function () { wrap("**", "**", "bold text"); }],
     ["I", "Italic", function () { wrap("*", "*", "italic text"); }],
     ["Link", "Link", link]].forEach(function (b) {
      var btn = h("button", { type: "button", title: b[1], "aria-label": b[1], style: b[0] === "B" ? "font-weight:700" : b[0] === "I" ? "font-style:italic" : null }, b[0]);
      btn.addEventListener("mousedown", function (e) { e.preventDefault(); });  // keep the selection in the field
      btn.addEventListener("click", b[2]);
      bar.appendChild(btn);
    });
    return [bar, sp];
  }

  /* ---------------------------------------------------------------- checkboxes */
  function tick(it) {
    var cb = h("input", { type: "checkbox", class: "tick", "aria-label": "Done: " + it.st.title.slice(0, 90), disabled: EDIT || PREVIEW || !LIVE || ARCHIVED ? true : null });
    cb.addEventListener("change", function () {
      if (cb.checked && window.DROnb && !DROnb.isEnrolled()) { cb.checked = false; DROnb.ensureEnrolled().then(function (ok) { if (ok) setDone(it.id, true); }); return; }
      setDone(it.id, cb.checked);
    });
    (boxes[it.id] = boxes[it.id] || []).push(cb);
    return cb;
  }
  function setDone(id, on) {
    if (on) S.done[id] = Date.now(); else delete S.done[id];
    S.last = id; if (!S.startedAt) S.startedAt = Date.now();
    if (!store) earlyEdits = true;
    renderProgress(); save();
  }

  /* ---------------------------------------------------------------- one step */
  var SPARK = "✦";
  var scope = { type: "path", id: null };
  function sparkBtn(type, id, label) {
    var b = h("button", { type: "button", class: "spark", title: "Change " + label + " with the LLM", "aria-label": "Change " + label + " with the LLM", "aria-pressed": String(scope.type === type && scope.id === id) }, SPARK);
    b.addEventListener("click", function (e) { e.stopPropagation(); setScope(type, id, label); });
    return b;
  }
  function stepRow(it) {
    var st = it.st;
    var tags = [];
    if (st.gate) tags.push(h("span", { class: "tag gate" }, "Gate"));
    tags.push(h("span", { class: "tag" + (st.type === "Required" ? " req" : "") }, st.type));
    var title = EDIT ? E(st, "title", { plain: true, ph: "Step title" }) : st.link && st.link.url ? a(st.link.url, st.title) : document.createTextNode(st.title);
    var body = h("div", { class: "ib" },
      h("div", { class: "ihead" }, tags),
      h("p", { class: "ititle" }, title),
      EDIT ? h("div", { class: "dt edblock-wrap" }, detailsEditor(st)) : st.details ? h("div", { class: "dt" }, rich(st.details, st.id)) : null,
      EDIT ? stepTools(it) : null,
      EDIT && st.source ? h("span", { class: "src" }, "From: " + st.source) : null,
      !EDIT && window.DROnb ? h("div", { class: "onb-rowtools" }, DROnb.starButton(it.id, st.title),
        DROnb.reportButton({ itemId: it.id, label: where(it) + ": " + st.title, anchor: "s-" + it.id, text: st.title + "\n" + DRFormat.plain(st.details || "") })) : null);
    return h("div", { class: "item" + (st.gate ? " gate" : "") + (EDIT ? " editing" : ""), id: "s-" + it.id, "data-id": it.id }, tick(it), body);
  }

      opts.forEach(function (o) { var b = h("button", { type: "button", "aria-pressed": String(o[0] === val) }, o[1]); b.addEventListener("click", function () { box._v = o[0]; $$("button", box).forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); if (box._on) box._on(o[0]); }); box.appendChild(b); });
      return box;
    }
    // A name picker: preset buttons plus "Custom…" with a text box. get() and set() hide which one is used.
    function names(presets, val) {
      var all = presets.map(function (x) { return [x, x || "None"]; }).concat([["custom", "Custom…"]]);
      var box = seg(all, presets.indexOf(val) >= 0 ? val : "custom");
      var input = h("input", { value: presets.indexOf(val) >= 0 ? "" : val, placeholder: "Your own name", hidden: presets.indexOf(val) >= 0, style: "margin-top:8px" });
      box._on = function (v) { input.hidden = v !== "custom"; if (v === "custom") input.focus(); };
      return { el: [box, input],
        get: function () { return box._v === "custom" ? (input.value.trim() || "Section") : box._v; },
        set: function (v) { var b = $$("button", box).filter(function (x) { return x.textContent === (v || "None"); })[0]; if (b) b.click(); else { $$("button", box).pop().click(); input.value = v; } } };
    }
    var cur = levels();
    var cad = seg([["weeks", "Calendar weeks"], ["days", "Working days"], ["self", "Self-paced"]], cadence());
    var top = names(["Week", "Day", "Module", "Phase"], cur[0]);
    var subN = names(["", "Day", "Module"], cur[1]);
    var cadHelp = h("span", { class: "small" });
    function helpText(v) { cadHelp.textContent = { weeks: "Each numbered section is one calendar week of the learner's schedule.", days: "Each " + (subN.get() ? subN.get().toLowerCase() : "numbered section") + " is one working day of the learner's schedule.", self: "No schedule: learners see their progress instead of on track or behind." }[v]; }
    helpText(cadence());
    // Changing the cadence also changes a level name that is still the old cadence's default.
    var lastCad = cadence();
    cad._on = function (v) {
      var was = DEF_LEVELS[lastCad], now = DEF_LEVELS[v];
      if (top.get() === was[0]) top.set(now[0]);
      if (subN.get() === was[1]) subN.set(now[1]);
      lastCad = v; helpText(v);
    };
    var skill = seg([["now", "Add now"], ["later", "Decide later"]], c.skill && c.skill.enabled ? "now" : "later");
    var skillName = h("input", { value: (c.skill && c.skill.name) || "", placeholder: "Skill name, for example agent monitoring", hidden: !(c.skill && c.skill.enabled) });
    skill._on = function (v) { skillName.hidden = v !== "now"; };
    var owners = h("input", { value: (INFO.owners || []).join(", ") });
    var err = h("p", { class: "err", hidden: true });
    var saveB = h("button", { type: "button", class: "btn primary" }, "Save"), cancel = h("button", { type: "button", class: "btn ghost" }, "Cancel");
    var del = INFO.status !== "published" ? h("button", { type: "button", class: "btn ghost", style: "margin-right:auto;color:#B00020" }, "Delete draft") : null;
    var dlg = h("div", { class: "onb-dialog wide2 settings", role: "dialog", "aria-modal": "true", "aria-label": "Path settings" },
      h("h2", null, "Settings"),
      h("label", { class: "field" }, h("span", { class: "label" }, "Path name"), title),
      h("label", { class: "field" }, h("span", { class: "label" }, "Who it's for"), blurb),
      h("label", { class: "field" }, h("span", { class: "label" }, "Length"), length),
      h("div", { class: "field" }, h("span", { class: "label" }, "Cadence"), cad, cadHelp),
      h("div", { class: "field" }, h("span", { class: "label" }, "Sections are called"), top.el),
      h("div", { class: "field" }, h("span", { class: "label" }, "Inside each section"), subN.el),
      h("div", { class: "field" }, h("span", { class: "label" }, "Skill growth"), skill, skillName),
      h("label", { class: "field" }, h("span", { class: "label" }, "Owners: they see this path's progress and problems"), owners),
      err, h("div", { class: "row" }, del, cancel, saveB));
    var m = modalOpen(dlg);
    cancel.addEventListener("click", m.close);
    if (del) del.addEventListener("click", function () {
      if (!confirm("Delete this draft? This can't be undone.")) return;
      api(ROOT + "api/admin/paths/" + PID, { method: "DELETE" }).then(function () { location.href = ROOT + "admin/#content"; }, function (e) { err.textContent = e.message; err.hidden = false; });
    });
    saveB.addEventListener("click", function () {
      var newSub = subN.get(), oldSub = sub();
      var split = C.groups.filter(function (g) { return g.days.length > 1; }).length;
      if (oldSub && !newSub && split && !confirm("Remove the " + oldSub.toLowerCase() + "s? The steps in each " + oldSub.toLowerCase() + " move into their section, in the same order. Learners keep their ticks.")) return;
      snapshot();
      C.title = title.value.trim() || C.title; C.blurb = blurb.value.trim(); C.length = length.value.trim();
      C.cadence = cad._v; C.levels = { top: top.get(), sub: newSub };
      if (oldSub && !newSub) C.groups.forEach(function (g) { var all = []; g.days.forEach(function (d) { all = all.concat(d.steps); }); g.days = [{ id: g.days[0].id, title: "", steps: all }]; });
      delete C.pace; delete C.level; delete C.useDays;
      C.skill = { enabled: skill._v === "now", name: skillName.value.trim() };
      saveB.disabled = true;
      api(ROOT + "api/admin/paths/" + PID + "/draft", jsonOpts("PUT", { content: C, owners: owners.value })).then(function (j) {
        INFO.owners = j.owners; C = j.draft; editDirty = false; m.close(); rebuild(); setState("draft");
      }, function (e) { saveB.disabled = false; err.textContent = e.message; err.hidden = false; });
    });
  }
  // What the LLM run reported (stored with a generated draft until it's published): sources used and not used,
  // links that didn't open, warnings about what couldn't be read.
  function reportDialog() {
    var r = INFO.generation || {}, cov = r.coverage || {};
    var close = h("button", { type: "button", class: "btn primary" }, "Close");
    var unused = (cov.unused || []).map(function (u) { return h("li", null, u.title + (u.reason ? " (" + u.reason + ")" : "")); });
    var dlg = h("div", { class: "onb-dialog wide2", role: "dialog", "aria-modal": "true", "aria-label": "Generation report" },
      h("h2", null, "Generation report"),
      h("p", { class: "small" }, "Generated " + (r.at ? new Date(r.at).toLocaleString() : "") + ". Every step lists the source it came from."),
      h("p", null, h("b", null, "Coverage: "), (cov.used || 0) + " of " + (cov.total || 0) + " sources are used in at least one step."),
      unused.length ? [h("p", null, h("b", null, "Not used")), h("ul", null, unused)] : null,
      (r.broken || []).length ? [h("p", null, h("b", null, "Links that didn't open")), h("ul", null, r.broken.map(function (u) { return h("li", null, a(u)); }))] : null,
      (r.warnings || []).length ? [h("p", null, h("b", null, "Warnings")), h("ul", null, r.warnings.map(function (w) { return h("li", null, w); }))] : null,
      h("div", { class: "row" }, close));
    var m = modalOpen(dlg);
    close.addEventListener("click", m.close);
  }
  function modalOpen(dialog) {
    var wrap = h("div", { class: "onb-modal" }, dialog);
    function close() { wrap.remove(); document.removeEventListener("keydown", esc); }
    function esc(e) { if (e.key === "Escape") close(); }
    wrap.addEventListener("click", function (e) { if (e.target === wrap) close(); });
    document.addEventListener("keydown", esc);
    document.body.appendChild(wrap);
    return { close: close };
  }
  function publishFlow() {
    var btn = $("#eb-publish");
    var go = function () {
      btn.disabled = true; btn.textContent = "Publishing…";
      (savingDraft || Promise.resolve()).then(function () { clearTimeout(saveTimer); return api(ROOT + "api/admin/paths/" + PID + "/draft", jsonOpts("PUT", { content: C })); })
        .then(function () { return api(ROOT + "api/admin/paths/" + PID + "/publish", { method: "POST" }); })
        .then(function () { location.hash = "g0"; location.reload(); }, function (e) { btn.disabled = false; btn.textContent = "Publish"; alert("Couldn't publish: " + e.message); });
    };
    var n = items.length;
    var ok = h("button", { type: "button", class: "btn primary" }, "Publish now"), back = h("button", { type: "button", class: "btn ghost" }, "Keep editing");
    var m = modalOpen(h("div", { class: "onb-dialog", role: "dialog", "aria-modal": "true" },
      h("h2", null, INFO.status === "published" ? "Publish your changes?" : "Publish this path?"),
      h("p", null, C.title + ": " + C.groups.length + " section" + (C.groups.length === 1 ? "" : "s") + ", " + n + " steps." + (INFO.status === "published" ? "" : " It appears on the hub for everyone.")),
      h("div", { class: "row" }, back, ok)));
    back.addEventListener("click", m.close);
    ok.addEventListener("click", function () { m.close(); go(); });
  }

  /* ---------------------------------------------------------------- search and report context */
  function searchEntries() {
    return items.map(function (it) { return { title: it.st.title, text: [DRFormat.plain(it.st.details || ""), it.st.type].join(" "), where: where(it), go: function () { goTo(it); } }; });
  }
  function reportContext() { var p = pages[current]; return { label: p ? (/^g\d+$/.test(current) ? gLabel(+current.slice(1)) + ": " : "") + p.dataset.title : "", anchor: current || "" }; }

  /* ---------------------------------------------------------------- build */
  function buildAll() {
    pages = {}; pageOrder = []; navItems = {}; boxes = {}; askEls = [];
    if (window.DROnb) DROnb.resetSearch();
    $("#main").textContent = ""; side.textContent = ""; $("#bricks").textContent = "";
    indexItems();
    document.title = C.title;
    $("#doc-title").textContent = "";
    $("#doc-title").appendChild(EDIT ? E(C, "title", { plain: true, ph: "Path name" }) : document.createTextNode(C.title));
    $("#doc-blurb").hidden = !C.blurb && !EDIT;
    $("#doc-blurb").textContent = ""; $("#doc-blurb").appendChild(EDIT ? E(C, "blurb", { plain: true, ph: "Who it's for (one sentence)" }) : document.createTextNode(C.blurb || ""));
    var units = C.groups.filter(numbered).length;
    $("#doc-length").textContent = C.length || (units + " " + lvl().toLowerCase() + (units === 1 ? "" : "s"));
    C.groups.forEach(buildGroup);
    if (EDIT) {
      var addG = h("button", { type: "button", class: "addrow", style: "margin-top:14px" }, "+ Add a " + lvl().toLowerCase());
      addG.addEventListener("click", function () { snapshot(); C.groups.push({ id: newId("g"), title: "", numbered: true, days: [{ id: newId("d"), title: "", steps: [] }] }); changed(true); show("g" + (C.groups.length - 1)); });
      pages["g" + (C.groups.length - 1)].appendChild(addG);
    }
    if (!EDIT) buildStarred();
    if (canEdit && LIVE && !EDIT && !PREVIEW) buildTeam();
    C.groups.forEach(function (g, gi) { side.appendChild(navItem("g" + gi)); });
    if (pages.starred) { side.appendChild(sep()); side.appendChild(navItem("starred")); }
    if (pages.team) { side.appendChild(sep()); side.appendChild(navItem("team")); }
    var wb = $("#bricks");
    wb.style.gridTemplateColumns = "repeat(" + Math.min(Math.max(C.groups.length, 1), 14) + ",1fr)";
    C.groups.forEach(function (g, gi) {
      var short = numbered(g) ? lvl().charAt(0) + gLabel(gi).split(" ").pop() : "•";
      wb.appendChild(h("a", { class: "daybrick", href: "#g" + gi, "data-page": "g" + gi, "aria-label": gLabel(gi) + (g.title && numbered(g) ? ": " + g.title : "") }, h("div", { class: "b" }, h("i")), h("span", null, short)));
    });
    renderAsk();
  }
  function renderAll() { renderProgress(); renderStarred(); if (window.DROnb) DROnb.refreshStars(); if (teamData) renderTeam(teamData); }
  var teamData = null;
  function rebuild() { var keep = current, y = window.scrollY; buildAll(); renderAll(); show(keep || "g0"); window.scrollTo(0, y); }

  function setMode(mode) {
    EDIT = mode === "edit"; PREVIEW = mode === "preview";
    // In edit mode the back link returns to Admin -> Content; learners and preview go back to the hub.
    $("#hub-link").href = EDIT ? ROOT + "admin/#content" : ROOT;
    $("#hub-link").textContent = EDIT ? "← Content" : "← All learning paths";
    document.body.classList.toggle("onb-editing", EDIT);
    $("#editbar").hidden = !EDIT; $("#previewbar").hidden = !PREVIEW;
    $("#top-actions").hidden = EDIT;
    $("#mascot").hidden = EDIT || !(C.skill && C.skill.enabled);
    var eb = $("#btn-edit"); if (eb) eb.hidden = EDIT;
    rebuild();
    if (EDIT) { updateBar(); setState("draft"); } else if (store) setState(store.kind, store.stateText);
  }

  window.addEventListener("beforeunload", function (e) { if (EDIT && editDirty) { saveDraft(); e.preventDefault(); e.returnValue = ""; } });

  /* ---------------------------------------------------------------- boot */
  function start() {
    $("#eb-settings").addEventListener("click", settingsDialog);
    $("#eb-report").addEventListener("click", reportDialog);
    $("#eb-preview").addEventListener("click", function () { clearTimeout(saveTimer); if (editDirty) saveDraft(); setMode("preview"); });
    $("#pv-back").addEventListener("click", function () { setMode("edit"); });
    $("#eb-undo").addEventListener("click", function () { var prev = history_.pop(); if (!prev) return; C = JSON.parse(prev); $("#eb-undo").disabled = !history_.length; changed(true); });
    $("#eb-publish").addEventListener("click", publishFlow);
    $("#eb-discard").addEventListener("click", function () {
      if (!confirm("Discard the unpublished changes and go back to the published version?")) return;
      C = clone(LIVE); history_ = []; saveDraft().then(function () { setMode("view"); C = LIVE; rebuild(); });
    });
    $("#btn-resume").addEventListener("click", function () { goTo(firstOpen(S)); });
    window.addEventListener("hashchange", route);

    function boot(info) {
      INFO = info || {};
      LIVE = INFO.live || null;
      ARCHIVED = INFO.status === "archived";
      canEdit = !!INFO.canEdit && !ARCHIVED;
      if (ARCHIVED) $("#doc-blurb").insertAdjacentElement("afterend", h("p", { class: "archived-note" },
        "This path is archived: you can see your progress, but steps can't be ticked any more."));
      C = LIVE || INFO.draft;
      if (!C) { $("#main").textContent = ""; $("#main").appendChild(h("div", { class: "empty" }, "This learning path isn't published yet.")); setState("local", "Not published"); return; }
      var cached = readCache();
      if (cached && cached.done) S = Object.assign(blank(), cached);
      var draftMode = canEdit && (!LIVE || location.hash === "#edit");
      if (draftMode) C = clone(INFO.draft || LIVE);
      buildAll(); renderAll();
      if (!route()) show("g0");
      var skillOn = !!(C.skill && C.skill.enabled);
      DROnb.init({ api: API, title: C.title, skill: skillOn ? C.skill.name || "" : "", assetBase: ROOT + "assets/", paceMount: $("#pace"), badgeMount: $("#badge"),
        mascotMount: skillOn ? $("#mascot") : null, toolsMount: $("#top-actions"), searchEntries: searchEntries, context: reportContext,
        isStarred: function (id) { return !!(S.stars && S.stars[id]); }, toggleStar: toggleStar, server: false, custom: true });
      if (!skillOn) $("#mascot").hidden = true;
      if (draftMode) { setMode("edit"); }
      if (canEdit && LIVE) {
        var eb = h("button", { type: "button", class: "btn ghost", id: "btn-edit" }, "Edit content");
        eb.addEventListener("click", function () { C = clone(INFO.draft || LIVE); setMode("edit"); });
        $("#top-actions").insertBefore(eb, $("#top-actions .onb-tools"));
      }
      if (!LIVE) return;  // drafts: no progress
      return api(API + "me").then(function (me) { return me && me.app === "dr-onboarding" ? serverStore(me) : localStore(); }, function () { return localStore(); }).then(function (st) {
        store = st; ME = st.me;
        return store.load().then(function (remote) {
          if (remote && (remote.done || remote.stars)) {
            var local = S; S = Object.assign(blank(), remote);
            if (earlyEdits) { Object.keys(local.done).forEach(function (k) { S.done[k] = local.done[k]; }); Object.keys(local.stars || {}).forEach(function (k) { S.stars[k] = local.stars[k]; }); save(); }
          } else if (Object.keys(S.done).length || Object.keys(S.stars || {}).length) save();
          if (!EDIT) setState(store.kind, store.stateText);
          if (store.kind === "server") DROnb.init({ server: true, onEnrolled: function () { renderProgress(); } });
          if (store.me && store.me.name) $("#who-name").textContent = store.me.name;
          if (canEdit && store.team) {
            var pollTeam = function () { store.team().then(function (j) { teamData = j; renderTeam(j); }, function () {}).then(function () { setTimeout(pollTeam, 60000); }); };
            pollTeam();
          }
          renderAll();
        });
      });
    }
    var embedded = DATA.content ? { live: DATA.status === "published" ? DATA.content : null, status: DATA.status } : null;
    api(API + "content").then(boot, function (e) {
      if (embedded && embedded.live) boot(embedded);
      else { $("#main").textContent = ""; $("#main").appendChild(h("div", { class: "empty" }, e.message)); setState("local", "Couldn't load"); }
    });
  }
  start();
})();
</script>
