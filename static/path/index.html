<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Learning path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a field manual. Header with one "data brick" per day; sidebar of days, each showing a brick per lab;
   one day at a time in the main column, every step a checkbox. Brand: DataRobot green as the anchor,
   black/white/gray base, solid colors only, regular weight type, mono caps for labels. */
:root{
  --bg:#FFFFFF;
  --panel:#F3F4F3;
  --ink:#0B0B0B;
  --muted:#4C5650;
  --line:#E4E4E4;
  --green:#81FBA5;
  --on-green:#0B0B0B;
  --link:#5C41FF;
  --yellow:#FFFF54;
  --blue:#44BFFC;
  --brick-empty:#E4E4E4;
  --focus:#5C41FF;
  --sans:"STK Miso","Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Monument Grotesk Mono","DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0B;--panel:#151816;--ink:#EDF1EE;--muted:#A2ACA5;--line:#2A2F2C;
    --link:#A6B0FF;--brick-empty:#2A2F2C;--focus:#A6B0FF;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B0B;--panel:#151816;--ink:#EDF1EE;--muted:#A2ACA5;--line:#2A2F2C;
  --link:#A6B0FF;--brick-empty:#2A2F2C;--focus:#A6B0FF;color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;font-weight:400;margin:0}
a{color:var(--link);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{font-weight:400;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.eyebrow,.label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
code,pre,kbd{font-family:var(--mono)}
code{font-size:.84em;background:var(--panel);padding:.08em .35em;border-radius:3px;overflow-wrap:anywhere}
pre code{background:none;padding:0;font-size:inherit;overflow-wrap:normal}

/* ---------- shell ---------- */
.wrap{max-width:1240px;margin:0 auto;padding-inline:24px}
.top{border-bottom:1px solid var(--line);padding-block:28px 22px}
.top-row{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end;justify-content:space-between}
.title-block{display:grid;gap:10px;min-width:0}
.title-block h1{font-size:clamp(34px,5vw,56px);line-height:1.02;letter-spacing:-.02em}
.who{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px;flex-wrap:wrap}
.who img{width:24px;height:24px;border-radius:50%}
.save-state{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);border-radius:999px}
.save-state[data-s="saving"]{border-color:var(--muted)}
.save-state[data-s="local"]{background:var(--yellow);color:#0B0B0B;border-color:var(--yellow)}
.meter{display:grid;gap:10px;min-width:min(100%,420px)}
.meter-figs{display:flex;align-items:baseline;gap:12px}
.meter-pct{font-size:44px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.meter-sub{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.daybricks{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.daybrick{display:grid;gap:5px;text-decoration:none;color:var(--muted)}
.daybrick .b{height:14px;background:var(--brick-empty);position:relative;overflow:hidden}
.daybrick .b i{position:absolute;inset:0 auto 0 0;background:var(--green);width:0}
.daybrick span{font-family:var(--mono);font-size:10px;letter-spacing:.06em}
.daybrick[aria-current="true"] span{color:var(--ink)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btn{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--ink);border-radius:var(--r);padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--green);color:var(--on-green);border-color:var(--green)}
.btn.primary{background:var(--green);color:var(--on-green);border-color:var(--green)}
.btn.primary:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{border-color:var(--line)}

/* values panel */
.values{border-bottom:1px solid var(--line);background:var(--panel);padding-block:20px}
.values-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 18px}
.field{display:grid;gap:6px;min-width:0}
.field input{font:inherit;font-size:15px;font-family:var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%;min-width:0}
.field input:focus{border-color:var(--ink);outline:none}
.values p.hint{color:var(--muted);font-size:14px;margin-top:12px;max-width:80ch}

/* frame: sidebar + main */
.frame{display:grid;grid-template-columns:250px minmax(0,1fr);gap:48px;padding-block:32px 80px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:grid;gap:2px;max-height:calc(100vh - 32px);overflow:auto}
.nav-item{display:grid;gap:6px;padding:10px 12px;border-radius:var(--r);text-decoration:none;color:var(--ink);border:1px solid transparent}
.nav-item:hover{background:var(--panel)}
.nav-item[aria-current="page"]{background:var(--panel);border-color:var(--line)}
.nav-item .nh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nav-item .nt{font-size:16px;line-height:1.2}
.nav-item .nc{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.labbricks{display:flex;gap:3px;flex-wrap:wrap}
.labbricks i{width:14px;height:6px;background:var(--brick-empty);position:relative;overflow:hidden;display:block}
.labbricks i b{position:absolute;inset:0 auto 0 0;background:var(--green)}
.labbricks i.opt{opacity:.55}
.side .sep{height:1px;background:var(--line);margin:8px 12px}

main{min-width:0}
[data-page]{display:grid;gap:28px;max-width:860px}
.page-head{display:grid;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.page-head h2{font-size:clamp(30px,4vw,42px);line-height:1.06;letter-spacing:-.02em}
.page-head .lede{font-size:19px;color:var(--muted);max-width:68ch}
.module{display:grid;gap:18px}
.module-head{display:grid;gap:8px;padding-top:6px}
.module-head h3{font-size:28px;line-height:1.1}
.goal{font-size:18px;max-width:68ch}
.explain{color:var(--ink);max-width:68ch}
.readfirst{display:grid;gap:8px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r)}
.readfirst ul{margin:0;padding-left:18px;display:grid;gap:4px}

/* lab cards */
.lab{border:1px solid var(--line);border-radius:var(--r);display:grid;scroll-margin-top:20px}
.lab-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.lab-num{font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:4px 8px;background:var(--panel);border-radius:3px;white-space:nowrap}
.lab.done .lab-num{background:var(--green);color:var(--on-green)}
.lab-head h4{font-size:21px;line-height:1.15}
.lab-count{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 7px;margin-left:8px;vertical-align:3px;color:var(--muted)}
.lab-body{display:grid;gap:16px;padding:16px 18px 18px;min-width:0}
.lab-body > p,.lab-body > .explain{max-width:68ch}

/* tasks */
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.task{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;align-items:start}
.tb{display:grid;gap:10px;min-width:0}
.tb > ul{margin:0;padding-left:18px;display:grid;gap:4px}
.tick{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:1px 0 0;border:1.5px solid var(--ink);border-radius:4px;background:var(--bg);cursor:pointer;display:grid;place-content:center}
.tick::after{content:"";width:11px;height:6px;border-left:2px solid var(--on-green);border-bottom:2px solid var(--on-green);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.tick:checked{background:var(--green);border-color:var(--green)}
.tick:checked::after{opacity:1}
.task.is-done > .tb > p:first-child{color:var(--muted)}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--green)}100%{background:transparent}}

.checkpoint,.selfcheck{border-radius:var(--r);padding:14px 16px}
.checkpoint{border:1.5px solid var(--green);}
.selfcheck{background:var(--panel)}
.checkpoint .label,.selfcheck .label{color:var(--ink)}

/* callouts */
.note,.known{display:grid;grid-template-columns:6px minmax(0,1fr);gap:14px;padding:12px 14px 12px 0;max-width:72ch}
.note::before,.known::before{content:"";background:var(--blue)}
.known::before{background:var(--yellow)}
.note > div,.known > div{display:grid;gap:6px;min-width:0}
.known .label::before{content:"Known issue"}
.note .label::before{content:attr(data-l)}

/* code */
.code{position:relative;min-width:0}
.code pre{margin:0;background:var(--panel);border-radius:var(--r);padding:38px 16px 14px;font-size:13.5px;line-height:1.55;overflow-x:auto;white-space:pre}
.copy{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 8px;cursor:pointer}
.copy:hover{background:var(--green);color:var(--on-green);border-color:var(--green)}
.ph{border-bottom:1.5px dashed var(--link);color:inherit}
.ph.filled{background:var(--green);color:var(--on-green);border-bottom:0;padding:0 2px;border-radius:2px}
.cm{color:var(--muted)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-family:var(--sans);font-size:14px;color:var(--muted);font-weight:400;background:var(--panel)}
td code{white-space:nowrap}
td.wrap code{white-space:normal}

/* overview */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.how{margin:0;padding-left:18px;display:grid;gap:8px;max-width:72ch}

/* learning log */

/* team */
.team-row-name{display:flex;align-items:center;gap:10px;min-width:160px}
.team-row-name img{width:28px;height:28px;border-radius:50%}
.minibricks{display:grid;grid-template-columns:repeat(8,22px);gap:3px}
.minibricks i{height:12px;background:var(--brick-empty);position:relative;overflow:hidden;display:block}
.minibricks i b{position:absolute;inset:0 auto 0 0;background:var(--green)}
.empty{padding:28px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);max-width:68ch}
.foot{color:var(--muted);font-size:14px;max-width:72ch;border-top:1px solid var(--line);padding-top:16px}

/* responsive */

/* rebuild: content generated from the Google Doc */
[data-page] > p,[data-page] > .block,[data-page] > ul{max-width:72ch}
[data-page] > .block ul,[data-page] > ul{margin:0;padding-left:18px;display:grid;gap:6px}
h2.mod{font-size:clamp(26px,3.4vw,34px);line-height:1.1;letter-spacing:-.015em;padding-top:18px;border-top:1px solid var(--line)}
[data-page] > h2.mod:first-child{border-top:0;padding-top:0}
h3.sub{font-size:20px;line-height:1.2}
.lab-head h3{font-size:21px;line-height:1.2;font-weight:400}
.lab-head{display:flex;align-items:center;gap:14px}
.lab-head h3{flex:1;min-width:0}
.lab-head .labtick{display:contents}
.lab-body ul{margin:0;padding-left:18px;display:grid;gap:4px}
.lab-body > p{max-width:72ch}
.tb > p + p{margin-top:0}
td.tickcell{white-space:nowrap}
td.tickcell .tick{display:inline-grid;vertical-align:middle;margin-right:8px}
.celltick{white-space:nowrap}
.foot{font-style:normal}
.values .hint{color:var(--muted);font-size:14px;margin-top:12px}

@media (max-width:900px){
  .frame{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:16px 64px}
  .side{position:static;max-height:none;display:flex;overflow-x:auto;gap:6px;padding-bottom:6px;margin-inline:-4px}
  .side .sep{display:none}
  .nav-item{flex:0 0 auto;min-width:150px}
  }
@media (max-width:520px){
  .wrap{padding-inline:16px}
  body{font-size:16px}
  .lab-head{padding:12px 14px}
  .lab-body{padding:14px}
  .meter-pct{font-size:36px}
  .daybrick span{font-size:9px}
}
.backlink{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.backlink:hover{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.rightcol{display:grid;gap:14px;min-width:min(100%,420px)}
.top-row{align-items:flex-start}
.mascot-slot{min-width:0}
.rightcol .onb-mascot{max-width:none}
.linkpop{position:absolute;z-index:45;display:flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--ink);border-radius:6px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.linkpop input{font:inherit;font-size:13px;font-family:var(--mono);border:1px solid var(--line);border-radius:4px;padding:3px 6px;width:min(420px,60vw)}
.linkpop button{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);padding:3px 8px;cursor:pointer}
</style>
<style>
/* Paths created in the app: same field-manual system as the other paths. */
[hidden]{display:none!important}
[data-page] > *{min-width:0}
.backlink{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.backlink:hover{color:var(--ink)}
.meter-extra{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.meter-extra b{font-weight:500;color:var(--ink)}
.rightcol{display:grid;gap:14px;min-width:min(100%,420px)}
.top-row{align-items:flex-start}
.rightcol .onb-mascot{max-width:none}
.blurb{color:var(--muted);font-size:17px;max-width:62ch}
.daylist{display:grid;gap:12px}
.dayhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin-top:8px}
.dayhead h3{font-size:22px}
.item{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;align-items:start;scroll-margin-top:70px}
.item.is-done{background:var(--panel)}
.item.is-done .ititle{color:var(--muted)}
.item .ib{display:grid;gap:8px;min-width:0}
.item .ihead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.item .ititle{font-size:18px;line-height:1.3}
.item .ititle a{color:inherit;text-decoration-color:var(--link)}
.item .ititle a:hover{color:var(--link)}
.item .dt{font-size:15px;max-width:72ch;white-space:pre-line}
.item .src{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel);border-radius:3px;padding:2px 6px;justify-self:start}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);white-space:nowrap}
.tag.req{border-color:var(--ink);color:var(--ink)}
.item.gate{border:1.5px solid var(--green)}
.item.gate .tag.gate{background:var(--green);border-color:var(--green);color:var(--on-green)}
.item.editing{background:color-mix(in srgb,var(--yellow) 14%,var(--bg))}
.ed{display:inline-block;min-width:2ch}
.ed:empty::before{content:attr(data-ph);color:var(--muted)}
.edblock{display:block;min-height:1.4em}
.addrow{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px dashed var(--muted);border-radius:var(--r);padding:8px 12px;cursor:pointer;justify-self:start}
.addrow:hover{border-color:var(--ink)}
.spark{font:inherit;font-size:15px;line-height:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;padding:3px 7px;cursor:pointer;vertical-align:middle}
.spark:hover,.spark[aria-pressed="true"]{border-color:var(--ink);background:var(--yellow);color:#0B0B0B}
.ask{border:1px solid var(--ink);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.ask textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-height:64px;width:100%;resize:vertical}
.ask .row,.proposal .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ask .sp,.proposal .sp{flex:1}
.ask .small,.small{font-size:14px;color:var(--muted)}
.proposal{background:var(--panel);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.chg{font-size:15px;padding:6px 10px;border-radius:4px;background:var(--bg);border-left:3px solid var(--blue)}
.chg.add{border-left-color:var(--green)}.chg.del{border-left-color:#B00020}
.chg .from{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.steps{display:grid;gap:6px}
.st{font-size:15px;padding-left:24px;position:relative}
.st.done::before{content:"✓";position:absolute;left:0;width:17px;height:17px;border-radius:50%;background:var(--green);color:#0B0B0B;font-size:11px;display:grid;place-items:center;top:2px}
.st.now::before{content:"";position:absolute;left:0;top:3px;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.notice{background:var(--yellow);color:#0B0B0B;border-radius:var(--r);padding:10px 12px;font-size:15px}
.grphead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grphead h2{flex:1 1 auto}
.settings{display:grid;gap:12px}
.settings .field input,.settings .field textarea,.settings select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.onb-dialog.wide2{max-width:640px;max-height:90vh;overflow:auto}
.team-detail td{background:var(--panel)}
@media (max-width:520px){
  .item{padding:12px;grid-template-columns:24px minmax(0,1fr);gap:10px}
  .item .ititle{font-size:17px}
}
</style>

<body>
<div class="onb-editbar" id="editbar" hidden>
  <div class="wrap">
    <b id="eb-title">Draft</b><span id="eb-note">Only owners and admins can see it.</span>
    <span style="flex:1"></span>
    <button class="btn" id="eb-settings" type="button">Settings</button>
    <button class="btn" id="eb-preview" type="button">Preview as learner</button>
    <button class="btn" id="eb-undo" type="button" disabled>Undo</button>
    <a class="btn" id="eb-xlsx" href="#">Download as .xlsx</a>
    <button class="btn" id="eb-discard" type="button" hidden>Discard changes</button>
    <button class="btn primary" id="eb-publish" type="button">Publish</button>
  </div>
</div>
<div class="onb-editbar" id="previewbar" hidden>
  <div class="wrap"><b>Preview as learner.</b><span>Ticks aren't saved.</span><span style="flex:1"></span><button class="btn primary" id="pv-back" type="button">Back to editing</button></div>
</div>
<header class="top">
  <div class="wrap">
    <a class="backlink" id="hub-link" href="../">&larr; All learning paths</a>
    <div class="top-row" style="margin-top:10px">
      <div class="title-block">
        <span class="eyebrow" id="doc-length"></span>
        <h1 id="doc-title">Learning path</h1>
        <p class="blurb" id="doc-blurb" hidden></p>
        <div class="who"><span id="who-name"></span><span class="save-state" id="save-state" data-s="init">Loading</span></div>
        <div class="onb-pace" id="pace"></div>
        <div id="badge" hidden></div>
      </div>
      <div class="rightcol">
        <div id="mascot"></div>
        <div class="meter" aria-label="Overall progress">
          <div class="meter-figs"><span class="meter-pct" id="pct">0%</span><span class="meter-sub" id="pct-sub">0 of 0 steps</span></div>
          <div class="meter-extra"><span>Required <b id="req-sub">0/0</b></span><span id="gate-wrap">Gates passed <b id="gate-sub">0/0</b></span></div>
          <nav class="daybricks" id="bricks" aria-label="Sections"></nav>
        </div>
      </div>
    </div>
    <div class="top-actions" id="top-actions">
      <button class="btn primary" id="btn-resume" type="button">Continue where I left off</button>
    </div>
  </div>
</header>
<div class="wrap frame">
  <nav class="side" id="side" aria-label="Learning path"></nav>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<!--PATH_JSON-->
<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var BASE = location.pathname.replace(/\/?$/, "/");
  var API = BASE + "api/";
  var ROOT = BASE + "../";
  $("#hub-link").href = ROOT;
  var DATA = {};
  try { DATA = JSON.parse(($("#path-data") || {}).textContent || "{}"); } catch (e) { DATA = {}; }
  var PID = DATA.id || BASE.split("/").filter(Boolean).pop();
  var CACHE_KEY = "dr-onb-path-" + PID;

  function blank() { return { v: 1, done: {}, stars: {}, startedAt: null, updatedAt: null, last: null }; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  var S = blank(), store = null, earlyEdits = false;
  var C = null;            // content shown (live for learners, draft while editing)
  var LIVE = null, INFO = null, ME = null;
  var EDIT = false, PREVIEW = false, canEdit = false;

  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    });
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  function a(url, label) { return h("a", { href: url, target: "_blank", rel: "noopener" }, label || url); }
  function rich(s) {
    var frag = document.createDocumentFragment();
    if (!s) return frag;
    String(s).split(/(`[^`]+`)/).forEach(function (part) {
      if (/^`[^`]+`$/.test(part)) { frag.appendChild(h("code", null, part.slice(1, -1))); return; }
      part.split(/(https?:\/\/[^\s)]+[^\s).,;:])/).forEach(function (p) {
        if (/^https?:\/\//.test(p)) frag.appendChild(a(p)); else if (p) frag.appendChild(document.createTextNode(p));
      });
    });
    return frag;
  }
  function api(path, opts) {
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.detail || ("Request failed (" + r.status + ")")); return j; });
    });
  }
  function jsonOpts(method, body) { return { method: method, headers: { "content-type": "application/json" }, body: JSON.stringify(body) }; }
  function newId(p) { return p + Math.random().toString(16).slice(2, 10); }

  /* ---------------------------------------------------------------- model helpers */
  var items = [], byId = {}, pages = {}, pageOrder = [], navItems = {}, boxes = {}, current = null;
  function lvl() { return (C && C.level) || "Week"; }
  function gLabel(gi) { return lvl() + " " + (gi + 1); }
  function where(it) { return gLabel(it.gi) + (C.useDays ? " · Day " + (it.di + 1) : ""); }
  function indexItems() {
    items = []; byId = {};
    C.groups.forEach(function (g, gi) { g.days.forEach(function (d, di) { d.steps.forEach(function (st) { var it = { st: st, id: st.id, gi: gi, di: di, g: g, d: d }; items.push(it); byId[st.id] = it; }); }); });
  }

  /* ---------------------------------------------------------------- editing helpers */
  var history_ = [], editDirty = false, saveTimer = null;
  function snapshot() { history_.push(JSON.stringify(C)); if (history_.length > 60) history_.shift(); $("#eb-undo").disabled = false; }
  function changed(rebuildNow) { editDirty = true; scheduleSave(); if (rebuildNow) rebuild(); }
  function E(obj, key, o) {
    o = o || {};
    var v = obj ? obj[key] : "";
    if (!EDIT) return o.plain ? document.createTextNode(v == null ? "" : String(v)) : rich(v);
    var sp = h("span", { contenteditable: "plaintext-only", class: "ed" + (o.block ? " edblock" : ""), spellcheck: "true", "data-ph": o.ph || "(empty)" });
    sp.textContent = v == null ? "" : String(v);
    var first = true;
    sp.addEventListener("input", function () { if (first) { snapshot(); first = false; } obj[key] = sp.textContent; changed(false); });
    sp.addEventListener("blur", function () { first = true; });
    if (!o.block) sp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); sp.blur(); } });
    ["click", "mousedown"].forEach(function (ev) { sp.addEventListener(ev, function (e) { e.stopPropagation(); }); });
    return sp;
  }

  /* ---------------------------------------------------------------- checkboxes */
  function tick(it) {
    var cb = h("input", { type: "checkbox", class: "tick", "aria-label": "Done: " + it.st.title.slice(0, 90), disabled: EDIT || PREVIEW || !LIVE ? true : null });
    cb.addEventListener("change", function () {
      if (cb.checked && window.DROnb && !DROnb.isEnrolled()) { cb.checked = false; DROnb.ensureEnrolled().then(function (ok) { if (ok) setDone(it.id, true); }); return; }
      setDone(it.id, cb.checked);
    });
    (boxes[it.id] = boxes[it.id] || []).push(cb);
    return cb;
  }
  function setDone(id, on) {
    if (on) S.done[id] = Date.now(); else delete S.done[id];
    S.last = id; if (!S.startedAt) S.startedAt = Date.now();
    if (!store) earlyEdits = true;
    renderProgress(); save();
  }

  /* ---------------------------------------------------------------- one step */
  var SPARK = "✦";
  var scope = { type: "path", id: null };
  function sparkBtn(type, id, label) {
    var b = h("button", { type: "button", class: "spark", title: "Change " + label + " with the LLM", "aria-label": "Change " + label + " with the LLM", "aria-pressed": String(scope.type === type && scope.id === id) }, SPARK);
    b.addEventListener("click", function (e) { e.stopPropagation(); setScope(type, id, label); });
    return b;
  }
  function stepRow(it) {
    var st = it.st;
    var tags = [];
    if (st.gate) tags.push(h("span", { class: "tag gate" }, "Gate"));
    tags.push(h("span", { class: "tag" + (st.type === "Required" ? " req" : "") }, st.type));
    var title = EDIT ? E(st, "title", { plain: true, ph: "Step title" }) : st.link && st.link.url ? a(st.link.url, st.title) : document.createTextNode(st.title);
    var body = h("div", { class: "ib" },
      h("div", { class: "ihead" }, tags),
      h("p", { class: "ititle" }, title),
      EDIT ? h("p", { class: "dt" }, E(st, "details", { block: true, ph: "Details: how to do it and how you know it's done" })) : st.details ? h("p", { class: "dt" }, rich(st.details)) : null,
      EDIT ? stepTools(it) : null,
      EDIT && st.source ? h("span", { class: "src" }, "From: " + st.source) : null,
      !EDIT && window.DROnb ? h("div", { class: "onb-rowtools" }, DROnb.starButton(it.id, st.title),
        DROnb.reportButton({ itemId: it.id, label: where(it) + ": " + st.title, anchor: "s-" + it.id, text: st.title + "\n" + (st.details || "") })) : null);
    return h("div", { class: "item" + (st.gate ? " gate" : "") + (EDIT ? " editing" : ""), id: "s-" + it.id, "data-id": it.id }, tick(it), body);
  }
  function stepTools(it) {
    var st = it.st, d = it.d;
    function sel(opts, val, onc, label) {
      var s = h("select", { "aria-label": label }, opts.map(function (o) { return h("option", { value: o[0], selected: String(o[0]) === String(val) }, o[1]); }));
      s.addEventListener("change", function () { snapshot(); onc(s.value); changed(true); });
      return s;
    }
    var link = h("input", { placeholder: "https://… (empty = no link)", value: (st.link && st.link.url) || "", "aria-label": "Link" });
    var lfirst = true;
    link.addEventListener("input", function () { if (lfirst) { snapshot(); lfirst = false; } var u = link.value.trim(); st.link = u ? { url: u, label: "" } : null; changed(false); });
    link.addEventListener("blur", function () { lfirst = true; });
    var gate = h("input", { type: "checkbox", checked: st.gate });
    gate.addEventListener("change", function () { snapshot(); st.gate = gate.checked; changed(true); });
    var days = [];
    C.groups.forEach(function (g, gi) { g.days.forEach(function (dd, di) { days.push([gi + ":" + di, gLabel(gi) + (C.useDays ? " · Day " + (di + 1) : "")]); }); });
    var up = h("button", { type: "button", title: "Move up" }, "↑"), down = h("button", { type: "button", title: "Move down" }, "↓");
    function mv(dir) { var i = d.steps.indexOf(st), j = i + dir; if (j < 0 || j >= d.steps.length) return; snapshot(); d.steps.splice(i, 1); d.steps.splice(j, 0, st); changed(true); focusStep(st.id); }
    up.addEventListener("click", function () { mv(-1); }); down.addEventListener("click", function () { mv(1); });
    var del = h("button", { type: "button", class: "danger" }, "Delete step");
    del.addEventListener("click", function () { snapshot(); d.steps.splice(d.steps.indexOf(st), 1); changed(true); });
    return h("div", { class: "onb-edittools" },
      h("label", null, C.useDays ? "Day" : lvl(), sel(days, it.gi + ":" + it.di, function (v) {
        var p = v.split(":"), to = C.groups[+p[0]].days[+p[1]];
        d.steps.splice(d.steps.indexOf(st), 1); to.steps.push(st);
      }, C.useDays ? "Day" : lvl())),
      h("label", null, "Type", sel([["Required", "Required"], ["Stretch", "Stretch"], ["Optional", "Optional"]], st.type, function (v) { st.type = v; }, "Type")),
      h("label", null, gate, "Gate"),
      h("label", { class: "grow" }, "Link", link),
      h("span", { class: "grp" }, up, down),
      sparkBtn("step", st.id, "this step"),
      del);
  }
  function addStepBtn(d) {
    var b = h("button", { type: "button", class: "addrow" }, "+ Add a step");
    b.addEventListener("click", function () { snapshot(); var st = { id: newId("s"), title: "", details: "", link: null, type: "Required", gate: false, source: "" }; d.steps.push(st); changed(true); focusStep(st.id, true); });
    return b;
  }

  /* ---------------------------------------------------------------- pages */
  function page(id, title, navLabel) {
    var sec = h("section", { "data-page": id, "data-title": title, hidden: true });
    pages[id] = sec; pageOrder.push(id); sec._nav = navLabel;
    $("#main").appendChild(sec);
    return sec;
  }
  function buildGroup(g, gi) {
    var sec = page("g" + gi, g.title || gLabel(gi), gLabel(gi));
    var head = h("div", { class: "page-head" },
      h("div", { class: "grphead" }, h("span", { class: "eyebrow" }, gLabel(gi)), h("span", { class: "label", "data-gcount": gi }), EDIT ? sparkBtn("group", g.id, gLabel(gi)) : null, EDIT ? groupMenu(gi) : null),
      h("h2", null, EDIT ? E(g, "title", { plain: true, ph: "Title for " + gLabel(gi) }) : (g.title || gLabel(gi))));
    add(sec, head);
    if (EDIT) add(sec, askBox());
    g.days.forEach(function (d, di) {
      var list = h("div", { class: "daylist" }, d.steps.map(function (st) { return stepRow(byId[st.id]); }), EDIT ? addStepBtn(d) : null);
      if (C.useDays) {
        add(sec, h("div", { class: "sec", style: "margin-top:20px" },
          h("div", { class: "dayhead" }, h("span", { class: "eyebrow" }, "Day " + (di + 1)), h("h3", null, EDIT ? E(d, "title", { plain: true, ph: "Day title (optional)" }) : (d.title || "")),
            EDIT ? sparkBtn("day", d.id, gLabel(gi) + " · Day " + (di + 1)) : null, EDIT && g.days.length > 1 ? dayDelete(g, d) : null),
          list));
      } else add(sec, h("div", { class: "sec", style: "margin-top:20px" }, list));
    });
    if (EDIT && C.useDays) {
      var ad = h("button", { type: "button", class: "addrow", style: "margin-top:12px" }, "+ Add a day");
      ad.addEventListener("click", function () { snapshot(); g.days.push({ id: newId("d"), title: "", steps: [] }); changed(true); });
      add(sec, ad);
    }
  }
  function dayDelete(g, d) {
    var b = h("button", { type: "button", class: "spark", title: "Delete this day" }, "Delete day");
    b.addEventListener("click", function () { if (d.steps.length && !confirm("Delete this day and its " + d.steps.length + " steps?")) return; snapshot(); g.days.splice(g.days.indexOf(d), 1); changed(true); });
    return b;
  }
  function groupMenu(gi) {
    var wrap = h("span", { class: "grp", style: "display:inline-flex;gap:4px" });
    var up = h("button", { type: "button", class: "spark", title: "Move earlier" }, "↑"), dn = h("button", { type: "button", class: "spark", title: "Move later" }, "↓");
    var del = h("button", { type: "button", class: "spark", title: "Delete " + gLabel(gi) }, "Delete");
    function mv(dir) { var j = gi + dir; if (j < 0 || j >= C.groups.length) return; snapshot(); var g = C.groups.splice(gi, 1)[0]; C.groups.splice(j, 0, g); changed(true); show("g" + j); }
    up.addEventListener("click", function () { mv(-1); }); dn.addEventListener("click", function () { mv(1); });
    del.addEventListener("click", function () {
      var n = C.groups[gi].days.reduce(function (t, d) { return t + d.steps.length; }, 0);
      if (C.groups.length === 1) { alert("A path needs at least one " + lvl().toLowerCase() + "."); return; }
      if (n && !confirm("Delete " + gLabel(gi) + " and its " + n + " steps?")) return;
      snapshot(); C.groups.splice(gi, 1); changed(true); show("g" + Math.max(0, gi - 1));
    });
    add(wrap, [up, dn, del]);
    return wrap;
  }

  /* ---------------------------------------------------------------- ask the LLM */
  var askEls = [], proposal = null, askText = "";
  function scopeLabel() {
    if (scope.type === "path") return "the whole path";
    return scope.label || scope.type;
  }
  function setScope(type, id, label) {
    scope = scope.type === type && scope.id === id ? { type: "path", id: null } : { type: type, id: id, label: label };
    $$(".spark[aria-pressed]").forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
    renderAsk();
    var box = pages[current] && pages[current].querySelector(".ask textarea");
    if (box) { box.scrollIntoView({ block: "center" }); box.focus(); }
  }
  function askBox() {
    var el = h("div", { class: "ask" });
    askEls.push(el);
    return el;
  }
  function renderAsk() {
    askEls = askEls.filter(function (x) { return x.isConnected; });
    askEls.forEach(function (el) {
      el.textContent = "";
      var ta = h("textarea", { placeholder: "For example: Day 2 is too long. Split it in two and add a lab on setting up a cost alert." });
      ta.value = askText;
      ta.addEventListener("input", function () { askText = ta.value; });
      var go = h("button", { type: "button", class: "btn primary" }, "Suggest changes");
      var err = h("p", { class: "err", hidden: true });
      var prog = h("div", { class: "steps", hidden: true });
      var clear = scope.type !== "path" ? h("button", { type: "button", class: "onb-linkbtn" }, "Use the whole path") : null;
      if (clear) clear.addEventListener("click", function () { setScope(scope.type, scope.id); });
      add(el, [h("span", { class: "label" }, "Ask the LLM to change the draft"), ta,
        h("div", { class: "row" }, h("span", { class: "small" }, "Applies to: ", h("b", null, scopeLabel()), " ", clear), h("span", { class: "sp" }), go), prog, err]);
      if (INFO && INFO.llm === false) { go.disabled = true; err.textContent = "The LLM Gateway isn't available to the app."; err.hidden = false; }
      go.addEventListener("click", function () {
        var ins = ta.value.trim();
        if (!ins) { ta.focus(); return; }
        go.disabled = true; err.hidden = true; prog.hidden = false; prog.textContent = "";
        api(ROOT + "api/admin/paths/" + PID + "/llm-edit", jsonOpts("POST", { instruction: ins, scope: { type: scope.type, id: scope.id }, content: C }))
          .then(function (j) { return poll(j.job, function (job) { drawProgress(prog, job); }); })
          .then(function (job) { go.disabled = false; prog.hidden = true; proposal = job.result; renderProposal(el); },
            function (e) { go.disabled = false; prog.hidden = true; err.textContent = e.message; err.hidden = false; });
      });
      if (proposal && el === askEls[0]) renderProposal(el);
    });
  }
  function renderProposal(el) {
    var old = el.parentNode && el.parentNode.querySelector(".proposal"); if (old) old.remove();
    if (!proposal) return;
    var apply = h("button", { type: "button", class: "btn primary" }, "Apply"), discard = h("button", { type: "button", class: "btn ghost" }, "Discard");
    var box = h("div", { class: "proposal" }, h("div", { class: "row" }, h("b", null, "Suggested changes"), h("span", { class: "sp" }), discard, apply),
      proposal.changes.map(function (c) { return h("div", { class: "chg " + c.kind }, ({ add: "+ ", del: "− ", mov: "↷ ", upd: "~ " })[c.kind] || "", c.text, c.source ? h("span", { class: "from" }, "From: " + c.source) : null); }));
    el.parentNode.insertBefore(box, el.nextSibling);
    discard.addEventListener("click", function () { proposal = null; box.remove(); });
    apply.addEventListener("click", function () { snapshot(); C = proposal.content; proposal = null; askText = ""; scope = { type: "path", id: null }; changed(true); });
  }
  function poll(jid, onProgress) {
    return new Promise(function (resolve, reject) {
      function tickJob() {
        api(ROOT + "api/admin/jobs/" + jid).then(function (j) {
          if (onProgress) onProgress(j);
          if (j.status === "done") resolve(j); else if (j.status === "error") reject(new Error(j.error || "Something went wrong.")); else setTimeout(tickJob, 1500);
        }, reject);
      }
      tickJob();
    });
  }
  function drawProgress(el, job) {
    el.textContent = "";
    (job.progress || []).forEach(function (p) { el.appendChild(h("div", { class: "st " + (p.done ? "done" : "now") }, p.text)); });
  }

  /* ---------------------------------------------------------------- starred and team */
  function buildStarred() {
    var sec = page("starred", "Starred", "Your list");
    add(sec, [h("div", { class: "page-head" }, h("span", { class: "eyebrow" }, "Your list"), h("h2", null, "Starred"),
      h("p", { class: "lede" }, "Steps you starred, newest first.")), h("div", { id: "starred-out", class: "onb-starred" })]);
  }
  function renderStarred() {
    var out = $("#starred-out"); if (!out) return;
    out.textContent = "";
    var ids = Object.keys(S.stars || {}).filter(function (id) { return byId[id]; }).sort(function (x, y) { return S.stars[y] - S.stars[x]; });
    if (!ids.length) out.appendChild(h("div", { class: "empty" }, "Nothing starred yet. Use the ☆ Star button under any step to keep it here."));
    ids.forEach(function (id) {
      var it = byId[id];
      var link = h("a", { href: "#s-" + id }, h("span", { class: "s" }, where(it) + (S.done[id] ? " · done" : "")), h("span", null, it.st.title));
      link.addEventListener("click", function (e) { e.preventDefault(); goTo(it); });
      out.appendChild(link);
    });
    if (navItems.starred) navItems.starred.nc.textContent = ids.length ? String(ids.length) : "";
  }
  function toggleStar(id) { S.stars = S.stars || {}; if (S.stars[id]) delete S.stars[id]; else S.stars[id] = Date.now(); if (!store) earlyEdits = true; renderStarred(); save(); }
  function buildTeam() {
    var sec = page("team", "Team progress", "Owners");
    add(sec, [h("div", { class: "page-head" }, h("span", { class: "eyebrow" }, "Owners and admins"), h("h2", null, "Team progress")), h("div", { id: "team-out" }, h("div", { class: "empty" }, "Loading progress…"))]);
  }
  function rel(ts) {
    if (!ts) return "—";
    var diff = (ts - Date.now()) / 1000, ab = Math.abs(diff), f = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
    if (ab < 3600) return f.format(Math.round(diff / 60), "minute");
    if (ab < 86400) return f.format(Math.round(diff / 3600), "hour");
    return f.format(Math.round(diff / 86400), "day");
  }
  function fmtDay(iso) { return iso ? new Date(iso + "T12:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "—"; }
  function renderTeam(j) {
    var out = $("#team-out"); if (!out) return;
    out.textContent = "";
    var all = (j && j.learners) || [];
    if (!all.length) { out.appendChild(h("div", { class: "empty" }, "No one has enrolled yet.")); return; }
    all.sort(function (x, y) { return ((y.state || {}).updatedAt || 0) - ((x.state || {}).updatedAt || 0); });
    var tb = h("tbody");
    all.forEach(function (l) {
      var st = Object.assign(blank(), l.state || {}), s = stats(st), m = l.meta || {};
      var fo = firstOpen(st);
      tb.appendChild(h("tr", null,
        h("td", { title: l.email || "" }, (l.name || l.email || "Someone") + (ME && l.id === ME.id ? " (you)" : "")),
        h("td", { style: "white-space:nowrap" }, fmtDay(m.start)),
        h("td", { style: "white-space:nowrap" }, m.cohort || "—"),
        h("td", null, m.pace ? h("span", { class: "onb-chip", "data-s": m.pace.status }, m.pace.label) : "—"),
        h("td", { style: "white-space:nowrap;font-variant-numeric:tabular-nums" }, pct(s.all) + "% · " + s.all[0] + "/" + s.all[1]),
        h("td", { style: "white-space:nowrap;font-variant-numeric:tabular-nums" }, s.req[0] + "/" + s.req[1]),
        h("td", { style: "white-space:nowrap", title: fo ? fo.st.title : "" }, fo ? where(fo) : "Finished"),

    });
    out.appendChild(h("div", { class: "tbl" }, h("table", null, h("thead", null, h("tr", null, ["Learner", "Start date", "Cohort", "Pace", "Progress", "Required", "Now on", "Last active"].map(function (t) { return h("th", null, t); }))), tb)));
  }

  /* ---------------------------------------------------------------- navigation */
  var side = $("#side");
  function navItem(pid) {

    var el = h("a", { class: "nav-item", href: "#" + pid, "data-nav": pid }, h("div", { class: "nh" }, h("span", { class: "label" }, p._nav), nc), h("span", { class: "nt" }, p.dataset.title));

  }
  function sep() { return h("div", { class: "sep" }); }

  function route() {

  /* ---------------------------------------------------------------- progress */
  function firstOpen(st) {

  function stats(st) {

  function pct(p) { return p[1] ? Math.round(100 * p[0] / p[1]) : 0; }

  /* ---------------------------------------------------------------- saving progress (same contract as the other paths) */

  /* ---------------------------------------------------------------- saving the draft */

  }
  var savingDraft = null;
  function saveDraft() {

    savingDraft = api(ROOT + "api/admin/paths/" + PID + "/draft", jsonOpts("PUT", { content: C })).then(function (j) {

    }, function (e) { setState("local", "Draft not saved: " + e.message); }).then(function () { savingDraft = null; });
    return savingDraft;
  }
  function updateBar() {
    var published = INFO && INFO.status === "published";
    $("#eb-title").textContent = published ? "Editing" : "Draft";
    $("#eb-note").textContent = published ? "Learners see the published version until you publish." : "Only owners and admins can see it.";
    $("#eb-discard").hidden = !published;
    $("#eb-xlsx").href = ROOT + "api/admin/paths/" + PID + "/export.xlsx";
  }

  /* ---------------------------------------------------------------- settings */
  function settingsDialog() {
    var c = C;
    var title = h("input", { value: c.title || "" }), blurb = h("textarea", { rows: 2 }), length = h("input", { value: c.length || "", placeholder: "For example 1 week" });
    blurb.value = c.blurb || "";

      var box = h("div", { class: "seg" }); box._v = val;
      opts.forEach(function (o) { var b = h("button", { type: "button", "aria-pressed": String(o[0] === val) }, o[1]); b.addEventListener("click", function () { box._v = o[0]; $$("button", box).forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); if (box._on) box._on(o[0]); }); box.appendChild(b); });
      return box;
    }
    var pace = seg([["weeks", "Calendar weeks"], ["days", "Working days"]], c.pace);
    var std = ["Week", "Module", "Phase", "Day"];
    var level = seg([["Week", "Week"], ["Module", "Module"], ["Phase", "Phase"], ["Day", "Day"], ["custom", "Custom…"]], std.indexOf(c.level) >= 0 ? c.level : "custom");
    var custom = h("input", { value: std.indexOf(c.level) >= 0 ? "" : c.level, placeholder: "Name for the top level", hidden: std.indexOf(c.level) >= 0 });
    level._on = function (v) { custom.hidden = v !== "custom"; if (v === "custom") custom.focus(); };
    var days = seg([["yes", "Yes"], ["no", "No"]], c.useDays ? "yes" : "no");
    var skill = seg([["now", "Add now"], ["later", "Decide later"]], c.skill && c.skill.enabled ? "now" : "later");
    var skillName = h("input", { value: (c.skill && c.skill.name) || "", placeholder: "Skill name, for example agent monitoring", hidden: !(c.skill && c.skill.enabled) });
    skill._on = function (v) { skillName.hidden = v !== "now"; };
    var owners = h("input", { value: (INFO.owners || []).join(", ") });
    var err = h("p", { class: "err", hidden: true });
    var saveB = h("button", { type: "button", class: "btn primary" }, "Save"), cancel = h("button", { type: "button", class: "btn ghost" }, "Cancel");
    var del = INFO.status !== "published" ? h("button", { type: "button", class: "btn ghost", style: "margin-right:auto;color:#B00020" }, "Delete draft") : null;
    var dlg = h("div", { class: "onb-dialog wide2 settings", role: "dialog", "aria-modal": "true", "aria-label": "Path settings" },
      h("h2", null, "Settings"),
      h("label", { class: "field" }, h("span", { class: "label" }, "Path name"), title),
      h("label", { class: "field" }, h("span", { class: "label" }, "Who it's for"), blurb),
      h("label", { class: "field" }, h("span", { class: "label" }, "Length"), length),
      h("div", { class: "field" }, h("span", { class: "label" }, "Pace"), pace),
      h("div", { class: "field" }, h("span", { class: "label" }, "Top level is called"), level, custom),
      h("div", { class: "field" }, h("span", { class: "label" }, "Days inside each " + (lvl() === "Day" ? "group" : lvl().toLowerCase())), days),
      h("div", { class: "field" }, h("span", { class: "label" }, "Skill growth"), skill, skillName),

    var m = modalOpen(dlg);
    cancel.addEventListener("click", m.close);
    if (del) del.addEventListener("click", function () {
      if (!confirm("Delete this draft? This can't be undone.")) return;
      api(ROOT + "api/admin/paths/" + PID, { method: "DELETE" }).then(function () { location.href = ROOT + "admin/#content"; }, function (e) { err.textContent = e.message; err.hidden = false; });
    });
    saveB.addEventListener("click", function () {
      snapshot();
      C.title = title.value.trim() || C.title; C.blurb = blurb.value.trim(); C.length = length.value.trim(); C.pace = pace._v;
      C.level = level._v === "custom" ? (custom.value.trim() || "Section") : level._v;
      var ud = days._v === "yes";
      if (C.useDays && !ud) C.groups.forEach(function (g) { var all = []; g.days.forEach(function (d) { all = all.concat(d.steps); }); g.days = [{ id: g.days[0].id, title: "", steps: all }]; });
      C.useDays = ud;
      C.skill = { enabled: skill._v === "now", name: skillName.value.trim() };
      saveB.disabled = true;
      api(ROOT + "api/admin/paths/" + PID + "/draft", jsonOpts("PUT", { content: C, owners: owners.value })).then(function (j) {
        INFO.owners = j.owners; C = j.draft; editDirty = false; m.close(); rebuild(); setState("draft");
      }, function (e) { saveB.disabled = false; err.textContent = e.message; err.hidden = false; });
    });
  }
  function modalOpen(dialog) {
    var wrap = h("div", { class: "onb-modal" }, dialog);

  }
  function publishFlow() {
    var btn = $("#eb-publish");
    var go = function () {

      (savingDraft || Promise.resolve()).then(function () { clearTimeout(saveTimer); return api(ROOT + "api/admin/paths/" + PID + "/draft", jsonOpts("PUT", { content: C })); })
        .then(function () { return api(ROOT + "api/admin/paths/" + PID + "/publish", { method: "POST" }); })
        .then(function () { location.hash = "g0"; location.reload(); }, function (e) { btn.disabled = false; btn.textContent = "Publish"; alert("Couldn't publish: " + e.message); });
    };
    var n = items.length;

    var m = modalOpen(h("div", { class: "onb-dialog", role: "dialog", "aria-modal": "true" },

      h("p", null, C.title + ": " + C.groups.length + " " + lvl().toLowerCase() + (C.groups.length === 1 ? "" : "s") + ", " + n + " steps." + (INFO.status === "published" ? "" : " It appears on the hub for everyone.")),
      h("div", { class: "row" }, back, ok)));

  /* ---------------------------------------------------------------- search and report context */
  function searchEntries() {

  }
  function reportContext() { var p = pages[current]; return { label: p ? (/^g\d+$/.test(current) ? gLabel(+current.slice(1)) + ": " : "") + p.dataset.title : "", anchor: current || "" }; }

  /* ---------------------------------------------------------------- build */
  function buildAll() {

    C.groups.forEach(function (g, gi) { wb.appendChild(h("a", { class: "daybrick", href: "#g" + gi, "data-page": "g" + gi, "aria-label": gLabel(gi) + (g.title ? ": " + g.title : "") }, h("div", { class: "b" }, h("i")), h("span", null, lvl().charAt(0) + (gi + 1)))); });
    renderAsk();
  }
  function renderAll() { renderProgress(); renderStarred(); if (window.DROnb) DROnb.refreshStars(); if (teamData) renderTeam(teamData); }
  var teamData = null;
  function rebuild() { var keep = current, y = window.scrollY; buildAll(); renderAll(); show(keep || "g0"); window.scrollTo(0, y); }

  function setMode(mode) {

    document.body.classList.toggle("onb-editing", EDIT);
    $("#editbar").hidden = !EDIT; $("#previewbar").hidden = !PREVIEW;

  /* ---------------------------------------------------------------- boot */

      var cached = readCache();

      if (draftMode) C = clone(INFO.draft || LIVE);
      buildAll(); renderAll();
      if (!route()) show("g0");
      var skillOn = !!(C.skill && C.skill.enabled);
      DROnb.init({ api: API, title: C.title, skill: skillOn ? C.skill.name || "" : "", assetBase: ROOT + "assets/", paceMount: $("#pace"), badgeMount: $("#badge"),
        mascotMount: skillOn ? $("#mascot") : null, toolsMount: $("#top-actions"), searchEntries: searchEntries, context: reportContext,
        isStarred: function (id) { return !!(S.stars && S.stars[id]); }, toggleStar: toggleStar, server: false, custom: true });
      if (!skillOn) $("#mascot").hidden = true;

          } else if (Object.keys(S.done).length || Object.keys(S.stars || {}).length) save();

          if (store.me && store.me.name) $("#who-name").textContent = store.me.name;
          if (canEdit && store.team) {
            var pollTeam = function () { store.team().then(function (j) { teamData = j; renderTeam(j); }, function () {}).then(function () { setTimeout(pollTeam, 60000); }); };
            pollTeam();
          }
          renderAll();
        });
      });
    }
    var embedded = DATA.content ? { live: DATA.status === "published" ? DATA.content : null, status: DATA.status } : null;
    api(API + "content").then(boot, function (e) {
      if (embedded && embedded.live) boot(embedded);
      else { $("#main").textContent = ""; $("#main").appendChild(h("div", { class: "empty" }, e.message)); setState("local", "Couldn't load"); }
    });
  }
  start();
})();
